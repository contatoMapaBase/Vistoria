function bindDashboard() { 
  bindFilterBar('dash'); 
  
  document.getElementById('evo-agrupamento')?.addEventListener('change', (e) => {
    state.evoAgrupamento = e.target.value;
    render();
  });
  
  const filtradas = aplicarFiltros(state.vistoriasIndex, 'dash').sort((a,b)=> new Date(a.dataHora) - new Date(b.dataHora));
  
  const categoriasMap = {};
  const porEst = {};

  let countItens = 0, countNC = 0, countNA = 0;

  filtradas.forEach(v => {
    countItens += (v.totalItens || 0);
    countNC += (v.totalNC || 0);
    countNA += (v.totalNA || 0);

    // Categoria por NC: usa ncsResumo (lista real de itens NC, com a categoria
    // que está de fato no item) — mais fiel que o agregado v.categorias, que pode
    // ficar desatualizado. Fallback para v.categorias se ncsResumo não existir.
    if (Array.isArray(v.ncsResumo) && v.ncsResumo.length > 0) {
      v.ncsResumo.forEach(nc => {
        const cat = (nc.categoria && nc.categoria.trim() !== '') ? nc.categoria.trim() : 'Sem categoria';
        categoriasMap[cat] = (categoriasMap[cat] || 0) + 1;
      });
    } else if (v.categorias) {
      for (const [cat, qtd] of Object.entries(v.categorias)) {
        categoriasMap[cat] = (categoriasMap[cat] || 0) + qtd;
      }
    }
    
    const estNome = v.estruturaNome || 'Sem Estrutura';
    if (!porEst[estNome]) {
      porEst[estNome] = { itens: 0, nc: 0 };
    }
    porEst[estNome].itens += (v.totalItens || 0);
    porEst[estNome].nc += (v.totalNC || 0);
  });

  const countConf = countItens - countNC - countNA;

  /* Destaques por Estrutura */
  const elDestaques = document.getElementById('dash-destaques-estrutura');
  if (elDestaques) {
    const arrEst = Object.keys(porEst).map(nome => {
      const tot = porEst[nome].itens;
      const pct = tot ? ((tot - porEst[nome].nc) / tot * 100) : 100;
      return { nome, pct };
    });
    
    arrEst.sort((a, b) => b.pct - a.pct);

    if (arrEst.length === 0) {
      elDestaques.innerHTML = '<div class="empty" style="padding:16px;">Sem dados</div>';
    } else if (arrEst.length < 4) {
      const piores = arrEst.slice().reverse().slice(0, 3);
      elDestaques.innerHTML = piores.map(e => `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; padding:10px; background:var(--surface-2); border-radius:6px;">
          <span style="font-weight:500;">${esc(e.nome)}</span>
          <span style="color:${e.pct < 70 ? 'var(--nc)' : (e.pct < 90 ? 'var(--media)' : 'var(--conforme)')}; font-weight:700;">${e.pct.toFixed(1)}%</span>
        </div>
      `).join('');
    } else {
      const melhores = arrEst.slice(0, 3);
      const piores = arrEst.slice().reverse().slice(0, 3);
      elDestaques.innerHTML = `
        <h4 style="margin:0 0 10px; font-size:13px; color:var(--conforme); text-transform:uppercase;">Melhores</h4>
        ${melhores.map(e => `
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; padding:10px; background:var(--surface-2); border-radius:6px;">
            <span style="font-weight:500;">${esc(e.nome)}</span>
            <span style="color:var(--conforme); font-weight:700;">${e.pct.toFixed(1)}%</span>
          </div>
        `).join('')}
        <h4 style="margin:16px 0 10px; font-size:13px; color:var(--nc); text-transform:uppercase;">Piores</h4>
        ${piores.map(e => `
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; padding:10px; background:var(--surface-2); border-radius:6px;">
            <span style="font-weight:500;">${esc(e.nome)}</span>
            <span style="color:var(--nc); font-weight:700;">${e.pct.toFixed(1)}%</span>
          </div>
        `).join('')}
      `;
    }
  }

  const donutCanvas = document.getElementById('dashDonutChart');
  if(donutCanvas) {
      if(window.dashDonutChartInstance) window.dashDonutChartInstance.destroy();
      
      const ctx = donutCanvas.getContext('2d');
      window.dashDonutChartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
              labels: ['Conformes', 'Não Conformidades', 'N/A'],
              datasets: [{
                  data: [countConf, countNC, countNA],
                  backgroundColor: ['#2F9E44', '#C4332C', '#8A9389'],
                  borderWidth: 2, borderColor: '#ffffff'
              }]
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            cutout: '70%', 
            plugins: { legend: { display: false } } 
          }
      });
      
      const legend = document.getElementById('dashDonutLegend');
      if(legend) {
        legend.innerHTML = `
          <div style="color:var(--conforme);">● Conformidades: ${countConf}</div>
          <div style="color:var(--nc);">● NCs: ${countNC}</div>
          ${countNA > 0 ? `<div style="color:var(--na);">● N/A: ${countNA}</div>` : ''}
          <div style="color:var(--ink);"><strong>Total Avaliado: ${countConf + countNC + countNA}</strong></div>
        `;
      }
  }

  const evoCanvas = document.getElementById('dashEvoChart');
  if(evoCanvas) {
    const s = serieEvolucaoAgrupada(filtradas, state.evoAgrupamento || 'mes');
    const titleEl = document.getElementById('dashEvoTitle');
    
    if(titleEl) {
      const periodo = s.labels.length > 1 
        ? `(${s.labels[0]} a ${s.labels[s.labels.length-1]})` 
        : (s.labels.length === 1 ? `(${s.labels[0]})` : '');
      titleEl.innerHTML = `Evolução do Desempenho <span style="font-size:16px;color:var(--ink-soft);font-weight:500;">${periodo}</span>`;
    }
    
    if(window.dashEvoChartInstance) window.dashEvoChartInstance.destroy();
    
    window.dashEvoChartInstance = new Chart(evoCanvas.getContext('2d'), {
      type: 'line',
      data: { 
        labels: s.labels, 
        datasets: [
          { 
            label: 'Conformidades', 
            data: s.confs, 
            borderColor: '#2F9E44', 
            backgroundColor: 'rgba(47,158,68,0.10)', 
            fill: false, 
            tension: 0.35, 
            borderWidth: 3,

          {

        responsive: true, 
        maintainAspectRatio: false, 
        interaction: { mode: 'index', intersect: false },

          y: { 
            min: 0, 
            ticks: { precision: 0 }, 
            title: { display: true, text: 'Quantidade de itens' }

            ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 }

  const catCanvas = document.getElementById('dashCatChart');
  if(catCanvas) {
      if(window.dashCatChartInstance) window.dashCatChartInstance.destroy();
      
      const sortedCats = Object.entries(categoriasMap).sort((a,b) => b[1] - a[1]);

  /* Pendências Recorrentes síncronas do índice */
  const recorr = new Map();
  filtradas.forEach(ix => {
    if (!ix.ncsResumo) return;
    ix.ncsResumo.forEach(it => {

      const cur = recorr.get(key) || { texto: it.texto, estrutura: ix.estruturaNome, categoria: it.categoria, n: 0 };

      recorr.set(key, cur);
    });

  const rec = [...recorr.values()].filter(x => x.n >= 2).sort((a,b) => b.n - a.n);

/* state.vistoriasIndex passa a conter APENAS vistorias ativas. A lixeira vive
   em state.lixeira. Isso é deliberado: cerca de 35 pontos do app leem o índice
   direto — painel, ranking, IGD, NCs, evolução — e filtrar em cada um seria
   frágil. Separando na fonte, uma vistoria na lixeira sai de todo cálculo sem
   nenhuma alteração nesses pontos. */
function separarLixeira() {
  const todas = state.vistoriasIndex || [];
  state.lixeira = todas.filter(v => v.excluidaEm);
  state.vistoriasIndex = todas.filter(v => !v.excluidaEm);
}

/* Grava as duas listas na mesma chave: o formato em disco continua um array
   só, então backup antigo e sincronização seguem funcionando. */
async function salvarIndice() {
  await storageSet('vistorias:index', [...(state.vistoriasIndex || []), ...(state.lixeira || [])]);
}

  };

      Aqui ele fica guardado por tempo indeterminado, fora do histórico, com quem excluiu e por quê.

            ${esc(v.excluidoPor || 'autor não identificado')}<br>

            ${v.motivoExclusao ? `<div style="margin-top:5px;color:var(--ink-soft);">"${esc(v.motivoExclusao)}"</div>` : ''}

function bindVistorias() { 
  bindFilterBar('hist');
  const bf = document.getElementById('backup-file');
  if (bf) bf.addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (file) restaurarBackup(file);
    ev.target.value = '';
  });
}

// Gera um backup leve (dados) de tudo e baixa como arquivo .json.
// Não baixa as fotos que estão no Storage — guarda os links; fotos antigas
// embutidas (base64) entram naturalmente.
window.exportarBackup = async function() {
  try {
    const idx = state.vistoriasIndex || [];
    const vistorias = [];
    for (let i = 0; i < idx.length; i++) {
      showToast(`Preparando backup... ${i + 1}/${idx.length}`);
      const v = await loadVistoria(idx[i].id);
      if (v) vistorias.push(v);
    }
    const backup = {
      formato: 'mapabase-backup',
      versao: 1,
      geradoEm: new Date().toISOString(),
      empreendimentos: state.empreendimentos || [],
      estruturas: state.estruturas || [],
      vistorias
    };
    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mapabase-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast(`Backup gerado: ${vistorias.length} check-lists, ${(state.empreendimentos||[]).length} empreend., ${(state.estruturas||[]).length} estrut.`);
  } catch (e) {
    console.error('Erro no backup:', e);
    showToast('Erro ao gerar o backup.');
  }
};

// Restaura um backup no modo JUNTAR (não apaga nada; só recupera o que falta).
window.restaurarBackup = async function(file) {
  let dados;
  try {
    dados = JSON.parse(await file.text());
  } catch (e) { showToast('Arquivo inválido.'); return; }

  if (!dados || dados.formato !== 'mapabase-backup' || !Array.isArray(dados.vistorias)) {
    showToast('Este arquivo não é um backup válido do MapaBase.');
    return;
  }

  const qEmp = (dados.empreendimentos || []).length;
  const qEst = (dados.estruturas || []).length;
  const qVist = dados.vistorias.length;
  const quando = dados.geradoEm ? new Date(dados.geradoEm).toLocaleString('pt-BR') : '';

  if (!confirm(`Restaurar backup${quando ? ' de ' + quando : ''}?\n\nConteúdo: ${qEmp} empreendimentos, ${qEst} estruturas, ${qVist} check-lists.\n\nMODO JUNTAR: o que já existe é mantido como está; só o que estiver faltando é recuperado. Nada é apagado.`)) return;

  showToast('Restaurando...');
  let addEmp = 0, addEst = 0, addVist = 0;

  for (const e of (dados.empreendimentos || [])) {
    if (!state.empreendimentos.some(x => x.id === e.id)) {
      state.empreendimentos.push(e);
      addEmp++;
      if (_supabase && navigator.onLine) {
        try { await _supabase.from('empreendimentos').upsert({ id: e.id, nome: e.nome, tipo: e.tipo, estruturas: e.estruturas, logo: e.logo || null, criado_em: e.criadoEm || e.criado_em || null, criado_por: e.criadoPor || null, atualizado_em: e.atualizadoEm || null, atualizado_por: e.atualizadoPor || null }); } catch (err) { console.warn(err); }
      }
    }
  }
  if (addEmp) await storageSet('empreendimentos', state.empreendimentos);

  for (const s of (dados.estruturas || [])) {
    if (!state.estruturas.some(x => x.id === s.id)) {
      state.estruturas.push(s);
      addEst++;
      if (_supabase && navigator.onLine) {
        try { await _supabase.from('estruturas').upsert({ id: s.id, nome: s.nome, setor: s.setor, itens: { setor: s.setor, list: s.itens || [] }, criado_em: s.criadoEm || null, criado_por: s.criadoPor || null, atualizado_em: s.atualizadoEm || null, atualizado_por: s.atualizadoPor || null }); } catch (err) { console.warn(err); }
      }
    }
  }
  if (addEst) await storageSet('estruturas', state.estruturas);

  for (const v of dados.vistorias) {
    if (!state.vistoriasIndex.some(x => x.id === v.id)) {
      await saveVistoria(v);
      addVist++;
    }
  }

  render();
  showToast(`Restaurado: +${addEmp} empreend., +${addEst} estrut., +${addVist} check-lists.`);
};

window.abrirVistoria = async function(id) {
  showToast('Carregando relatório...'); 
  try {
    const v = await loadVistoria(id);
    if (v && v.itens && v.itens.length > 0) { 
      state.vistoriaAberta = v; 
      setView('vistoria-detalhe'); 
    } else if (v) {
      showToast('O relatório foi baixado, mas a lista de perguntas está vazia.');
    } else {
      console.warn('Ação interrompida: vistoria retornou null.');
    }
  } catch (e) {
    showToast('Erro ao abrir tela: ' + e.message);
  }
}

window.removerItemHistorico = async function(vistId, itemId) {
  if(!confirm('Tem certeza que deseja excluir permanentemente este item do relatório salvo?')) return;
  showToast('Removendo item e recalculando...');
  
  const v = await loadVistoria(vistId);
  if(!v) return showToast('Erro ao carregar a vistoria original.');

  v.itens = v.itens.filter(i => i.id !== itemId);
  await saveVistoria(v); 
  
  state.vistoriaAberta = v;
  render();

// Duplica um check-list do histórico: cria uma cópia editável, com data de hoje.
// As fotos NÃO são copiadas (evidência é específica de cada inspeção) — a cópia
// nasce sem fotos e você anexa as novas ao editar.
window.duplicarVistoria = async function(id) {
  const origem = await loadVistoria(id);
  if(!origem) { showToast('Não foi possível carregar o check-list para duplicar.'); return; }

  if(!confirm('Duplicar este check-list?\n\nSerá criada uma cópia EDITÁVEL, com a data de hoje, mantendo estrutura, itens, respostas e observações. As FOTOS não são copiadas — você anexa as novas ao editar.')) return;

  const copia = {
    id: uid(),
    empreendimentoNome: origem.empreendimentoNome,
    estruturaNome: origem.estruturaNome,
    equipe: origem.equipe || '',
    responsavel: origem.responsavel || '',
    dataHora: new Date().toISOString(),
    gps: null,
    itens: (origem.itens || []).map(it => ({ ...it, fotos: [] })),
    observacaoGeral: origem.observacaoGeral || ''
  };

  await saveVistoria(copia);
  showToast('Check-list duplicado! Ele já está no histórico — abra para editar.');
  setView('vistorias');
};

/* Exclusão vai para a lixeira, não apaga. Vistoria é evidência de verificação
   de conformidade, com fotos e NCs — e num app offline-first o marcador de
   exclusão sincroniza como atualização, enquanto o delete definitivo feito sem
   sinal era desfeito pela sincronização seguinte. */
window.deletarVistoriaAtual = async function() {
  const aberta = state.vistoriaAberta;
  if (!aberta) return;
  const motivo = prompt(
    'Enviar este check-list para a lixeira.\n\n' +
    'Ele sai do histórico mas continua guardado, com as fotos, e pode ser restaurado.\n' +
    'Descreva o motivo (obrigatório):', '');
  if (motivo === null) return;
  if (motivo.trim().length < 5) return showToast('Descreva o motivo da exclusão.');

  const id = aberta.id;
  const quando = new Date().toISOString();
  const quem = state.usuarioEmail || 'usuário não identificado';

  aberta.excluidaEm = quando; aberta.excluidoPor = quem; aberta.motivoExclusao = motivo.trim();
  const idx = state.vistoriasIndex.find(v => v.id === id);
  if (idx) {
    Object.assign(idx, { excluidaEm: quando, excluidoPor: quem, motivoExclusao: motivo.trim() });
    state.vistoriasIndex = state.vistoriasIndex.filter(v => v.id !== id);
    state.lixeira = (state.lixeira || []).concat([idx]);
  }

  await salvarIndice();
  await storageSet('vistoria:' + id, aberta);
  if (_supabase && navigator.onLine) {
    await _supabase.from('vistorias')
      .update({ excluida_em: quando, excluido_por: quem, motivo_exclusao: motivo.trim() }).eq('id', id);
  }
  state.vistoriaAberta = null;
  setView('vistorias');
  showToast('Enviado para a lixeira. Pode ser restaurado no histórico.');
};

window.restaurarVistoria = async function(id) {
  const idx = (state.lixeira || []).find(v => v.id === id);
  if (!idx) return;
  delete idx.excluidaEm; delete idx.excluidoPor; delete idx.motivoExclusao;
  state.lixeira = state.lixeira.filter(v => v.id !== id);
  state.vistoriasIndex = state.vistoriasIndex.concat([idx]);
  const paga = await storageGet('vistoria:' + id);
  if (paga) { delete paga.excluidaEm; delete paga.excluidoPor; delete paga.motivoExclusao;
              await storageSet('vistoria:' + id, paga); }
  await salvarIndice();
  if (_supabase && navigator.onLine) {
    await _supabase.from('vistorias')
      .update({ excluida_em: null, excluido_por: null, motivo_exclusao: null }).eq('id', id);
  }
  render();
  showToast('Check-list restaurado.');
};

/* Definitivo, e só a partir da lixeira. Aqui as fotos do Storage também vão,
   porque a partir deste ponto não há como restaurar. */
window.apagarDefinitivo = async function(id) {
  const idx = (state.lixeira || []).find(v => v.id === id);
  if (!idx) return;
  const conf = prompt('Isto apaga o check-list e as fotos da nuvem. NÃO tem desfazer.\n\n' +
    'Para confirmar, digite APAGAR:', '');
  if (!conf || conf.trim().toUpperCase() !== 'APAGAR') return;

  const paga = await storageGet('vistoria:' + id);
  const paths = [];
  ((paga && paga.itens) || []).forEach(it => (it.fotos || []).forEach(f => { if (ehFotoRemota(f)) paths.push(caminhoFoto(f)); }));

  state.lixeira = state.lixeira.filter(v => v.id !== id);
  await salvarIndice();
  await storageRemove('vistoria:' + id);
  if (_supabase && navigator.onLine) {
    await _supabase.from('vistorias').delete().eq('id', id);
    if (paths.length) { try { await _supabase.storage.from(FOTOS_BUCKET).remove(paths); } catch(e) { console.warn('Fotos não removidas:', e); } }
  }
  render();
  showToast('Apagado definitivamente.');
};

window.alternarLixeira = function() { state.verLixeira = !state.verLixeira; render(); };

window.editarVistoriaAtual = function() {
  try {
    const v = state.vistoriaAberta;
    if(!v || !v.itens) {
      showToast('Erro: Os dados desse check-list estão corrompidos ou incompletos.');
      return;
    }
    
    const respostas = {};
    v.itens.forEach(it => {
      respostas[it.id] = { 
        status: it.status || '', 
        observacao: it.observacao || '', 
        criticidade: it.criticidade || 'media', 
        recomendacao: it.recomendacao || '', 
        fotos: it.fotos || [] 
      };
    });
    
    state.novaVistoria = {
      id: v.id, step: 1, emp: v.empreendimentoNome, est: v.estruturaNome,
      equipe: v.equipe || '',
      resp: v.responsavel, gps: v.gps, dataHora: v.dataHora,
      itens: v.itens, respostas: respostas,
      observacaoGeral: v.observacaoGeral || '',
      mostrarTodasEstruturas: true
    };
    setView('nova');
  } catch (e) {
    showToast('Erro na abertura do painel de edição: ' + e.message);
  }
}

  const originalView = state.view;

  content.innerHTML = `

window.toggleEvoEmp = function(val, checked) {
  if (checked) {
    if (!state.evoEmps.includes(val)) state.evoEmps.push(val);
  } else {
    state.evoEmps = state.evoEmps.filter(e => e !== val);
  }
  const validEsts = new Set(state.vistoriasIndex.filter(v => state.evoEmps.includes(v.empreendimentoNome)).map(v => v.estruturaNome));
  state.evoEsts = state.evoEsts.filter(est => validEsts.has(est));
  render();
};

window.toggleEvoEst = function(val, checked) {
  if (checked) {
    if (!state.evoEsts.includes(val)) state.evoEsts.push(val);
  } else {

};

  const canvas = document.getElementById('evoChart');
  if (canvas) {
    if (window.evoChartInstance) window.evoChartInstance.destroy();
    
    const selectedVists = state.vistoriasIndex.filter(v => state.evoEmps.includes(v.empreendimentoNome) && state.evoEsts.includes(v.estruturaNome))
      .sort((a,b)=> new Date(a.dataHora) - new Date(b.dataHora));
      
    const uniqueDatesIso = [...new Set(selectedVists.map(v => v.dataHora))].sort((a,b)=> new Date(a) - new Date(b));
    const labels = uniqueDatesIso.map(iso => fmtDate(iso).split(' às')[0]);
    
    // Uma linha por combinação empreendimento + estrutura (permite comparar a
    // MESMA estrutura entre empreendimentos diferentes, sem somar).
    const multiEmp = state.evoEmps.length > 1;
    const combos = [];
    state.evoEmps.forEach(emp => {
      state.evoEsts.forEach(est => {
        // só cria a linha se existir ao menos um check-list dessa combinação
        if (selectedVists.some(v => v.empreendimentoNome === emp && v.estruturaNome === est)) {
          combos.push({ emp, est });
        }
      });
    });

    const datasets = combos.map((combo, index) => {
      const vistsCombo = selectedVists.filter(v => v.empreendimentoNome === combo.emp && v.estruturaNome === combo.est);

      const data = uniqueDatesIso.map(iso => {
         const fmt = fmtDate(iso).split(' às')[0];
         const match = vistsCombo.find(v => fmtDate(v.dataHora).split(' às')[0] === fmt);
         if (!match) return null;
         // Se há categoria filtrada, conta só as NCs daquela categoria (via ncsResumo);
         // senão, usa o total de NCs do check-list.
         if (state.evoCategoria) {
           if (!Array.isArray(match.ncsResumo)) return 0;
           return match.ncsResumo.filter(nc => {
             const c = (nc.categoria && nc.categoria.trim()) ? nc.categoria.trim() : 'Sem categoria';
             return c === state.evoCategoria;
           }).length;
         }
         return match.totalNC || 0;
      });

      // Mais de um empreendimento selecionado -> "Empreendimento — Estrutura"
      // para diferenciar; um só -> apenas a estrutura (evita repetição).
      const label = multiEmp ? `${combo.emp} — ${combo.est}` : combo.est;
      const color = `hsl(${(index * 137.5) % 360}, 70%, 45%)`;
      return {
        label: label,
        data: data,
        borderColor: color,
        backgroundColor: color,
        fill: false,
        tension: 0.3,
        spanGaps: true,
        borderWidth: 3,
        pointRadius: 4,
        pointHoverRadius: 6
      };
    });

    const ctx = canvas.getContext('2d');
    window.evoChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: datasets
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: { y: { min: 0, ticks: { precision: 0 }, title: { display: true, text: 'Não Conformidades' } } },
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }

  if (state.evoEsts.length === 1 && state.evoEmps.length > 0) {
    const selectedVists = state.vistoriasIndex.filter(v => state.evoEmps.includes(v.empreendimentoNome) && v.estruturaNome === state.evoEsts[0]);
    const empDaEstrutura = selectedVists.find(v => v.estruturaNome === state.evoEsts[0])?.empreendimentoNome;
    
    if (empDaEstrutura) {
      const m = await matrizEvolucao(empDaEstrutura, state.evoEsts[0]);
      window._matrizEvoCache = m;

      const cor = st => st==='conforme'?'var(--conforme-bg)':st==='nc'?'var(--nc-bg)':st==='na'?'var(--na-bg)':'#fff';
      const txt = st => st==='conforme'?'✓':st==='nc'?'✕':st==='na'?'N/A':'—';
      const bCls = { regularizado:'conforme', recorrente:'nc', novo:'alta', agravou:'critica', conforme:'conforme', nc:'nc', na:'na' };
      const bTxt = { regularizado:'Regularizado', recorrente:'Reincidente', novo:'Novo', agravou:'Agravou', conforme:'Conforme', nc:'Não Conf.', na:'N/A' };

      const matEl = document.getElementById('evo-matriz');
      if (matEl) {
        matEl.innerHTML = `
        <div class="table-wrapper">
          <table style="min-width:100%;font-size:13px;">
            <thead>
              <tr>
                <th style="min-width:220px;">Item</th>
                ${m.vistorias.map(v=>`<th style="text-align:center;white-space:nowrap;">${fmtDate(v.dataHora).split(' às')[0]}</th>`).join('')}
                <th>Situação</th>
              </tr>
            </thead>
            <tbody>
              ${m.linhas.map(l=>`
                <tr>
                  <td style="font-weight:500;">${esc(l.texto)}</td>
                  ${l.celulas.map(c=>`<td style="text-align:center;background:${cor(c.status)};font-weight:700;">${txt(c.status)}</td>`).join('')}
                  <td><span class="badge ${bCls[l.classificacao]||'na'}">${bTxt[l.classificacao]||'—'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
      }

      const com = gerarComentarios(m);
      const bloco = (titulo, arr, cls) => `
        <div class="card card-pad" style="break-inside:avoid;">
          <h4 style="margin:0 0 12px;color:var(--${cls});">${titulo} (${arr.length})</h4>
          ${arr.length?'<ul style="margin:0;padding-left:18px;line-height:1.7;">'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p style="color:var(--ink-faint);margin:0;">Nenhum.</p>'}
        </div>`;
      const comEl = document.getElementById('evo-comentarios');
      if (comEl) {
        comEl.innerHTML = bloco('✅ Melhorias',com.regularizados,'conforme')+bloco('🔴 Recorrentes',com.recorrentes,'nc')+bloco('⚠️ Novos',com.novos,'alta')+bloco('📈 Agravamentos',com.agravados,'critica');
      }
    }
  } else if (state.evoEsts.length > 1) {
    document.getElementById('evo-matriz').innerHTML = `<div class="empty">Selecione apenas UMA estrutura para ver a análise item a item.</div>`;
    document.getElementById('evo-comentarios').innerHTML = '';
    window._matrizEvoCache = null;
  }
}

/* ============================================================
   TELA: MAPEAMENTO DE NCs CONSOLIDADAS

function viewNcs() {
  // categorias existentes nas NCs (para popular o filtro)
  const cats = new Set();
  state.vistoriasIndex.forEach(ix => {
    if(Array.isArray(ix.ncsResumo)) ix.ncsResumo.forEach(nc => {
      cats.add((nc.categoria && nc.categoria.trim() !== '') ? nc.categoria.trim() : 'Sem categoria');
    });
  });
  const catAtual = (state.filtros.nc && state.filtros.nc.categoria) ? state.filtros.nc.categoria : '';
  const catOptions = [...cats].sort().map(c => `<option value="${esc(c)}" ${catAtual===c?'selected':''}>${esc(c)}</option>`).join('');

  return `
  <div class="view-head no-print">
    <div><div class="eyebrow">Consolidado</div><h1 class="view-title">Mapeamento de NCs</h1></div>
    <div class="rowflex">
      <button class="btn primary" onclick="carregarNcsNaTela()">🔍 Aplicar Filtros e Carregar Relatório</button>
      <button class="btn ghost" onclick="window.print()">🖨️ Imprimir Consolidado</button>
    </div>
  </div>
  ${renderFilterBar('nc')}
  <div class="card card-pad no-print" style="margin-bottom:16px;padding:12px 16px;">
    <label class="field-label" style="margin-bottom:6px;">Filtrar por Categoria da NC</label>
    <select id="filter-nc-categoria" onchange="if(!state.filtros.nc) state.filtros.nc={}; state.filtros.nc.categoria=this.value; carregarNcsNaTela();" style="max-width:320px;">
      <option value="">Todas as Categorias</option>
      ${catOptions}
    </select>
  </div>
  <div id="ncs-container">
    <div class="empty card"><div class="ic">⚠️</div>Clique no botão acima para compilar todas as pendências.</div>
  </div>`;
}

window.carregarNcsNaTela = async function() {
  const container = document.getElementById('ncs-container');
  container.innerHTML = '<div class="empty">Processando dados, aguarde...</div>';
  
  const filtradas = aplicarFiltros(state.vistoriasIndex, 'nc');
  
  let allNcs = [];
  filtradas.forEach(ix => {
    if(ix.ncsResumo && ix.ncsResumo.length > 0) {
      ix.ncsResumo.forEach(it => {
        allNcs.push({
          emp: ix.empreendimentoNome,
          est: ix.estruturaNome,
          data: ix.dataHora,
          vistId: ix.id,
          item: it
        });
      });
    }
  });

  // filtro por categoria da NC (select próprio da tela)
  const catFiltro = (state.filtros.nc && state.filtros.nc.categoria) ? state.filtros.nc.categoria : '';
  if (catFiltro) {
    allNcs = allNcs.filter(nc => {
      const c = (nc.item.categoria && nc.item.categoria.trim() !== '') ? nc.item.categoria.trim() : 'Sem categoria';
      return c === catFiltro;
    });
  }

  if(allNcs.length === 0) {
    container.innerHTML = '<div class="empty card" style="color:var(--conforme);"><div class="ic">✨</div>Nenhuma não conformidade encontrada com os filtros selecionados!</div>';
    return;
  }

  const critWeight = { critica: 4, alta: 3, media: 2, baixa: 1 };
  allNcs.sort((a, b) => (critWeight[b.item.criticidade] || 0) - (critWeight[a.item.criticidade] || 0));

  container.innerHTML = `
  <div class="print-only-title" style="display:none;text-align:center;margin-bottom:20px;">
    <h1 style="font-family:var(--font-display);font-size:32px;margin:0;">Mapeamento de Não Conformidades</h1>
    <p style="margin:6px 0 0;font-size:15px;color:#555;">${descricaoPeriodo('nc', filtradas)}</p>
    ${(state.filtros.nc.emp && state.filtros.nc.emp.length) ? `<p style="margin:2px 0 0;font-size:13px;color:#777;">Empreendimentos: ${state.filtros.nc.emp.map(e=>esc(e)).join(', ')}</p>` : ''}
    ${(state.filtros.nc.est && state.filtros.nc.est.length) ? `<p style="margin:2px 0 0;font-size:13px;color:#777;">Estruturas: ${state.filtros.nc.est.map(e=>esc(e)).join(', ')}</p>` : ''}
    ${catFiltro ? `<p style="margin:2px 0 0;font-size:13px;color:#777;">Categoria: ${esc(catFiltro)}</p>` : ''}
    <p style="margin:4px 0 0;font-size:12px;color:#999;">Total de NCs: ${allNcs.length} · Emitido em ${new Date().toLocaleDateString('pt-BR')}</p>
  </div>
  <div class="card table-wrapper" style="border-color:var(--nc-bg);">
    <table>
      <thead><tr><th>Criticidade</th><th>Local / Estrutura</th><th>Categoria</th><th>Item Reprovado</th><th>Data</th><th class="no-print">Ação</th></tr></thead>
      <tbody>
        ${allNcs.map(nc => `
          <tr style="break-inside:avoid;">
            <td><span class="badge ${nc.item.criticidade}">${criticidadeLabel(nc.item.criticidade)}</span></td>
            <td><strong>${esc(nc.emp)}</strong><br><span style="font-size:12px;color:var(--ink-soft);">${esc(nc.est)}</span></td>
            <td style="font-size:12.5px;color:var(--ink-soft);white-space:nowrap;">${esc(nc.item.categoria) || 'Sem categoria'}</td>
            <td style="max-width:280px; font-weight:500;">${esc(nc.item.texto)}</td>
            <td style="font-size:13px;">${fmtDate(nc.data).split(' às')[0]}</td>
            <td class="no-print"><button class="btn ghost sm" onclick="abrirVistoria('${nc.vistId}')">Abrir</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ============================================================
   EXPORTAÇÃO E INICIALIZAÇÃO
   ============================================================ */
window.exportarExcel = async function(tipo = 'total', valor = '', empNome = '') {
  showToast('Gerando base Excel, aguarde...');
  
  let csvContent = "\uFEFF"; 
  csvContent += "Empreendimento;Estrutura;Equipe;Data e Hora;Responsável;Item de Inspeção;Categoria;Status;Observação Registrada;Criticidade;Recomendação Técnica;Observações Gerais\n";

  const escCsv = (texto) => {
    if (!texto) return '""';
    const str = texto.toString().replace(/"/g, '""').replace(/\n/g, " ");
    return `"${str}"`;
  };

  let indexVists = state.vistoriasIndex;
  if (tipo === 'emp') {
     indexVists = state.vistoriasIndex.filter(v => v.empreendimentoNome === valor);
  } else if (tipo === 'mes') {
     indexVists = state.vistoriasIndex.filter(v => {
       if (v.empreendimentoNome !== empNome) return false;
       const d = new Date(v.dataHora);
       if (isNaN(d)) return false;
       return d.toISOString().slice(0, 7) === valor; 
     });
  } else if (tipo === 'vist') {
     indexVists = state.vistoriasIndex.filter(v => v.id === valor);
  } else if (tipo === 'evo') {
     indexVists = state.vistoriasIndex.filter(v => state.evoEmps.includes(v.empreendimentoNome) && state.evoEsts.includes(v.estruturaNome))
       .sort((a,b)=> new Date(a.dataHora) - new Date(b.dataHora));
  }

  if (indexVists.length === 0) return showToast('Nenhum dado encontrado.');

  for(const idx of indexVists) {
    const v = await loadVistoria(idx.id);
    if(!v) continue;
    
    const dataFmt = fmtDate(v.dataHora);
    const emp = escCsv(v.empreendimentoNome);
    const est = escCsv(v.estruturaNome);
    const equipe = escCsv(v.equipe);
    const resp = escCsv(v.responsavel);
    const obsGeral = escCsv(v.observacaoGeral);

    v.itens.forEach(it => {
      const itemTxt = escCsv(it.texto);
      const cat = escCsv(it.categoria);
      const statusLabel = it.status === 'conforme' ? 'Conforme' : (it.status === 'nc' ? 'Não Conforme' : 'N/A');
      const status = escCsv(statusLabel);
      const obs = escCsv(it.observacao);
      const crit = escCsv(it.criticidade ? criticidadeLabel(it.criticidade) : '');
      const rec = escCsv(it.recomendacao);

      csvContent += `${emp};${est};${equipe};${escCsv(dataFmt)};${resp};${itemTxt};${cat};${status};${obs};${crit};${rec};${obsGeral}\n`;
    });
  }

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  let filename = `mapabase_${tipo}_${new Date().getTime()}.csv`;
  link.setAttribute("download", filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('Download concluído!');
};

async function iniciarApp() {
  showToast('Carregando dados da nuvem...');
  const syncOk = await syncGlobalNuvem();
  
  if(!syncOk) {
    const emp = await storageGet('empreendimentos');
    const est = await storageGet('estruturas');
    state.empreendimentos = emp || [];
    state.estruturas = est || [];
    await loadVistoriasNuvem();
  }

  let adicionouNova = false;
  DEFAULT_ESTRUTURAS.forEach(def => {
    if (!state.estruturas.some(e => e.nome === def.nome || e.id === def.id)) {
      state.estruturas.push(def);
      if (_supabase && navigator.onLine) {
        _supabase.from('estruturas').upsert({ id: def.id, nome: def.nome, setor: def.setor, itens: { setor: def.setor, list: def.itens } });
      }
      adicionouNova = true;
    }
  });
  
  if (adicionouNova) {
    await storageSet('estruturas', state.estruturas);
  }
  
  // flag do backfill temporário de pendências recorrentes (esconde o botão se já rodou)
  try { window._backfillNcsFeito = await storageGet('flag:backfillNcs') === true; } catch(e) { window._backfillNcsFeito = false; }

  // categorias já conhecidas (para sugestões ao adicionar/editar itens)
  try { state.categoriasConhecidas = (await storageGet('categorias:conhecidas')) || []; } catch(e) { state.categoriasConhecidas = []; }

  try { await carregarPoligonos(); } catch(e) { console.warn('poligonais:', e); }

  state.ready = true;
  render();

  // Recuperação de rascunho: se houver um check-list não finalizado salvo
  // automaticamente, oferece continuar de onde parou.
  try {
    const rasc = await storageGet(RASCUNHO_KEY);
    if (rascunhoTemConteudo(rasc)) {
      const quando = rasc._salvoEm ? new Date(rasc._salvoEm).toLocaleString('pt-BR') : '';
      const ok = confirm('Há um check-list não finalizado' + (quando ? ', salvo automaticamente em ' + quando : '') + '.\n\nOK = continuar de onde parou\nCancelar = descartar esse rascunho');
      if (ok) {
        delete rasc._salvoEm;
        state.novaVistoria = rasc;
        setView('nova');
      } else {
        await limparRascunho();
      }
    }
  } catch (e) { /* rascunho é best-effort */ }
}

async function checkAuth() {
  const loginScreen = document.getElementById('login-screen');
  
  if (!_supabase) {
    alert("AVISO: URL e Chave do Supabase não configuradas corretamente.");
    return;
  }
  
  const { data: { session } } = await _supabase.auth.getSession();
  
  if (session) {
    // Sem isto, todo campo "quem fez" grava null: criado_por das poligonais,
    // por dos achados, e agora excluido_por das vistorias.
    state.usuarioEmail = (session.user && session.user.email) || null;
    loginScreen.style.display = 'none';
    iniciarApp(); 
    return;
  }

  document.getElementById('btn-entrar').onclick = async () => {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-pass').value;
    
    const { error } = await _supabase.auth.signInWithPassword({ email, password: pass });
    
    if (error) {
      alert('Falha no login. Verifique as credenciais.');
    } else { 
      state.usuarioEmail = email || null;
      loginScreen.style.display = 'none'; 
      iniciarApp(); 
    }
  };
}

document.getElementById('btn-logout').onclick = async () => {
  if (_supabase) { 
    await _supabase.auth.signOut(); 
    window.location.reload(); 
  }
};

/* ============================================================
   PWA: uso offline confiável
   - Service Worker: permite abrir/recarregar o app SEM internet.
   - Armazenamento persistente: evita que o sistema apague os dados locais.
   - Wake Lock: mantém a tela acesa durante o preenchimento (evita standby).
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      // Procura automaticamente por uma versão nova publicada (só efetiva quando online).
      const checarAtualizacao = () => { try { reg.update(); } catch (e) {} };
      checarAtualizacao();
      // Reverifica ao voltar o foco para o app e a cada 30 minutos.
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checarAtualizacao(); });
      setInterval(checarAtualizacao, 30 * 60 * 1000);
    }).catch(err => console.warn('SW não registrado:', err));
  });
}

if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted()
    .then(persistido => { if (!persistido) return navigator.storage.persist(); })
    .catch(() => {});
}

let _wakeLock = null;
async function gerenciarWakeLock() {
  try {
    const querer = (state.view === 'nova');
    if (querer && !_wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    } else if (!querer && _wakeLock) {
      await _wakeLock.release();
      _wakeLock = null;
    }
  } catch (e) { /* best-effort: alguns navegadores não suportam */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') gerenciarWakeLock();
});

checkAuth();
