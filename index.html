      <p style="font-size:13px;color:var(--ink-faint);max-width:52ch;margin:0 auto;">
        Anexe o KML da ADA no cadastro do empreendimento, em
        <strong>Empreendimentos → Editar</strong>. A aba passa a mostrar a área e
        a sua posição, e funciona sem internet.
      </p>
    </div>`;
  }

  if (!m.empId || !emps.some(e => e.id === m.empId)) m.empId = emps[0].id;
  const lista = poligonosDoEmp(m.empId);

  return `
  <div class="view-head">
    <div><h2>Mapa</h2>
      <p class="view-sub">Sua posição sobre as poligonais do empreendimento. O GPS funciona sem internet.</p></div>
  </div>

  <div class="card" style="padding:12px;margin-bottom:12px;">
    <div class="field" style="margin:0;">
      <label class="field-label">Empreendimento</label>
      <select id="mapa-emp">
        ${emps.map(e => `<option value="${esc(e.id)}" ${e.id === m.empId ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}
      </select>
    </div>
  </div>

  <div id="mapa-situacao"></div>

  <div class="card" style="padding:0;overflow:hidden;margin-bottom:12px;">
    <div id="mapa-palco" style="position:relative;width:100%;height:58vh;min-height:320px;
         background:#e8eef4;touch-action:none;overflow:hidden;cursor:grab;">
      <div id="mapa-camadas" style="position:absolute;left:0;top:0;will-change:transform;">
        <div id="mapa-tiles-ant" style="position:absolute;left:0;top:0;transform-origin:0 0;"></div>
        <div id="mapa-tiles" style="position:absolute;left:0;top:0;"></div>
        <svg id="mapa-svg" style="position:absolute;left:0;top:0;" aria-label="Mapa das poligonais">
          <g id="mapa-vetor"></g>
          <g id="mapa-eu"></g>
        </svg>
      </div>
      <div id="mapa-escala" style="position:absolute;left:10px;bottom:10px;font-size:10.5px;
           background:rgba(255,255,255,.86);padding:3px 7px;border-radius:5px;
           border:1px solid rgba(0,0,0,.12);font-variant-numeric:tabular-nums;"></div>
      <div id="mapa-ctrl" style="position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3;">
        <button class="btn sm ghost mapa-bt" id="mapa-expandir" title="Abrir em tela cheia"
                onclick="mapaTelaCheia()">&#9974;</button>
        <button class="btn sm ghost mapa-bt" id="mapa-zin">+</button>
        <button class="btn sm ghost mapa-bt" id="mapa-zout">&minus;</button>
      </div>
      <div id="mapa-atrib" style="position:absolute;right:8px;bottom:8px;font-size:9.5px;
           background:rgba(255,255,255,.8);padding:2px 6px;border-radius:4px;color:#333;"></div>
    </div>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
    <button class="btn sm ghost" id="mapa-caber">Enquadrar área</button>
    <button class="btn sm ${m.seguindo ? 'primary' : 'ghost'}" id="mapa-seguir">Centrar em mim</button>
    <button class="btn sm ${m.satelite ? 'primary' : 'ghost'}" id="mapa-sat">Satélite</button>
    <button class="btn sm ${m.reforcar ? 'primary' : 'ghost'}" id="mapa-fill">Reforçar área</button>
    <button class="btn sm ghost" onclick="baixarKmlVisiveis()">Baixar KML</button>
  </div>

  <div class="card cam-card">
    <div class="cam-titulo">Camadas</div>
    <div id="mapa-camadas-lista">${listaCamadasHtml()}</div>
    <p style="font-size:11px;color:var(--ink-faint);margin:10px 0 0;">
      A poligonal desenhada é a que foi anexada ao cadastro. Confira a licença vigente
      antes de tratar a linha como limite autorizado.
    </p>
  </div>`;
}

/* ============================================================
   DESENHO
   ============================================================ */
/* ============================================================
   DESENHO
   ------------------------------------------------------------
   Separado em duas operações de custo muito diferente:

   mapaLayout()      reconstrói a grade de tiles e os caminhos do vetor.
                     Roda só quando o zoom muda, a tela muda de tamanho,
                     ou o arraste chega perto da borda da grade.
   mapaTransformar() move tudo com uma única transformação CSS.
                     Roda a cada quadro do arraste. É barata.

   A versão anterior refazia innerHTML da camada de tiles a cada evento de
   pointermove: todo <img> era destruído e recriado, cada um recomeçando o
   download. Era isso que fazia piscar. Agora os tiles são reaproveitados
   por chave z/x/y e nunca recarregam durante o arraste.
   ============================================================ */

const TILE_Z_MAX = 19;   // maior zoom com imagem própria no Esri World Imagery
const MAPA_Z_MAX = 21;   // acima disso, amplia o tile de 19 (overzoom)
const MARGEM_GRADE = 1;  // telas extras de tile ao redor, para arrastar sem rebuild

function mapaLayout() {
  const m = state.mapa;
  const palco = document.getElementById('mapa-palco');
  const camadas = document.getElementById('mapa-camadas');
  if (!palco || !camadas) return;

  m.larg = palco.clientWidth; m.alt = palco.clientHeight;

  // Overzoom: acima de z19 pedimos o tile de 19 e ampliamos. Assim dá mais
  // aproximação sem depender de imagem que a fonte gratuita não tem.
  const zt = Math.min(m.z, TILE_Z_MAX);
  const esc = Math.pow(2, m.z - zt);
  const passo = 256 * esc;                       // tamanho do tile na tela

  const orX = m.cx - m.larg / 2, orY = m.cy - m.alt / 2;
  const mx = m.larg * MARGEM_GRADE, my = m.alt * MARGEM_GRADE;

  const t0x = Math.floor((orX - mx) / passo), t1x = Math.floor((orX + m.larg + mx) / passo);
  const t0y = Math.floor((orY - my) / passo), t1y = Math.floor((orY + m.alt + my) / passo);

  /* Quando o NÍVEL DO TILE muda, as chaves z/x/y mudam e todos os tiles são
     recriados — era isto que ainda fazia a pinça piscar branco. A solução é
     manter a camada anterior visível, escalada para o novo zoom, até a nova
     carregar. O usuário vê a imagem antiga um instante borrada, em vez de nada.

     Matemática do reposicionamento: um ponto que estava em p_ant no espaço
     anterior está em k·p_ant + (k·refAnt − refNovo) no espaço novo, com
     k = 2^(z − zAnterior). Uma translação e uma escala resolvem a camada toda. */
  const ztAnt  = m.grade ? m.grade.zt : null;
  const refAnt = m.ref ? m.ref.slice() : null;
  const zAnt   = m.zAnt != null ? m.zAnt : m.z;

  m.grade = { zt, esc, passo, t0x, t1x, t0y, t1y };
  m.ref = [t0x * passo, t0y * passo];            // canto da grade, em px do zoom atual

  const divAnt = document.getElementById('mapa-tiles-ant');
  const divAtual = document.getElementById('mapa-tiles');

  if (m.satelite && ztAnt !== null && ztAnt !== zt && refAnt && divAnt) {
    clearTimeout(m.limparAnt);
    divAnt.innerHTML = '';
    while (divAtual.firstChild) divAnt.appendChild(divAtual.firstChild);
    const k = Math.pow(2, m.z - zAnt);
    divAnt.style.transform =
      `translate(${(k * refAnt[0] - m.ref[0]).toFixed(1)}px, ${(k * refAnt[1] - m.ref[1]).toFixed(1)}px) scale(${k})`;
    divAnt.style.opacity = '1';
    if (m.tiles) m.tiles.clear();
  }
  m.zAnt = m.z;

  // ---- tiles, reaproveitados por chave
  m.tiles = m.tiles || new Map();
  if (!m.satelite) {
    m.tiles.forEach(el => el.remove());
    m.tiles.clear();
    if (divAnt) divAnt.innerHTML = '';
    document.getElementById('mapa-atrib').textContent = '';
  } else {
    const n = Math.pow(2, zt);
    const precisa = new Set();
    for (let tx = t0x; tx <= t1x; tx++) {
      for (let ty = t0y; ty <= t1y; ty++) {
        if (ty < 0 || ty >= n) continue;
        const wx = ((tx % n) + n) % n;
        const chave = `${zt}/${wx}/${ty}`;
        precisa.add(chave);
        let el = m.tiles.get(chave);
        if (!el) {
          el = document.createElement('img');
          el.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zt}/${ty}/${wx}`;
          el.alt = ''; el.draggable = false; el.decoding = 'async';
          el.style.cssText = 'position:absolute;opacity:0;transition:opacity .18s;';
          // Fade curto no lugar do salto branco. Tile já em cache aparece
          // praticamente instantâneo, então não atrasa nada.
          el.addEventListener('load', () => { el.style.opacity = '1'; contarCarga(); }, { once: true });
          el.addEventListener('error', () => { el.style.visibility = 'hidden'; contarCarga(); }, { once: true });
          document.getElementById('mapa-tiles').appendChild(el);
          m.tiles.set(chave, el);
        }
        // Reposiciona sem recriar: é isto que elimina o recarregamento.
        el.style.left   = (tx * passo - m.ref[0]) + 'px';
        el.style.top    = (ty * passo - m.ref[1]) + 'px';
        el.style.width  = passo + 'px';
        el.style.height = passo + 'px';
      }
    }
    m.tiles.forEach((el, k) => { if (!precisa.has(k)) { el.remove(); m.tiles.delete(k); } });
    // Solta a camada anterior quando a maior parte da nova já apareceu, e de
    // qualquer forma depois de 1,2 s — para não ficar presa se um tile falhar.
    m.aguardando = precisa.size;
    m.carregados = 0;
    clearTimeout(m.limparAnt);
    m.limparAnt = setTimeout(() => soltarAnterior(), 1200);
    document.getElementById('mapa-atrib').textContent =
      'Imagens: Esri, Maxar' + (esc > 1 ? ` · ampliado ${esc}×` : '');
  }

  // ---- vetor, desenhado em coordenadas da grade
  const px = (lon, lat) => {
    const [x, y] = lonLatParaPx(lon, lat, m.z);
    return [x - m.ref[0], y - m.ref[1]];
  };
  const comFundo = m.satelite;
  const opac  = m.reforcar ? 0.45 : (comFundo ? 0.10 : 0.38);
  const traco = comFundo ? 3 : 2;

  let svg = '';
  m.geos.forEach(g => {
    const cfg = CORES_POLIGONO[g._tipo] || CORES_POLIGONO.outro;
    const c = cfg.cor;
    if (g.tipo === 'poligono') {
      const d = g.aneis.map(a => 'M' + a.map(([lo, la]) => px(lo, la).map(v => v.toFixed(1)).join(',')).join('L') + 'Z').join(' ');
      svg += `<path d="${d}" fill="${c}" fill-opacity="${opac}" fill-rule="evenodd"
               stroke="${c}" stroke-width="${traco}" stroke-linejoin="round"
               ${cfg.tracejado ? `stroke-dasharray="${cfg.tracejado}"` : ''}/>`;
    } else if (g.tipo === 'linha') {
      svg += `<path d="M${g.aneis[0].map(([lo, la]) => px(lo, la).map(v => v.toFixed(1)).join(',')).join('L')}"
               fill="none" stroke="${c}" stroke-width="${traco}" stroke-dasharray="7 4"/>`;
    } else {
      const [x, y] = px(g.aneis[0][0][0], g.aneis[0][0][1]);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
    }
  });

  const lg = (t1x - t0x + 1) * passo, at = (t1y - t0y + 1) * passo;
  const el = document.getElementById('mapa-svg');
  el.setAttribute('width', lg); el.setAttribute('height', at);
  el.setAttribute('viewBox', `0 0 ${lg} ${at}`);
  el.style.width = lg + 'px'; el.style.height = at + 'px';
  document.getElementById('mapa-vetor').innerHTML = svg;

  mapaMarcador();
  mapaTransformar();
  mapaEscala();
}

function contarCarga() {
  const m = state.mapa;
  m.carregados = (m.carregados || 0) + 1;
  if (m.aguardando && m.carregados >= Math.ceil(m.aguardando * 0.7)) soltarAnterior();
}

function soltarAnterior() {
  const m = state.mapa;
  clearTimeout(m.limparAnt);
  const el = document.getElementById('mapa-tiles-ant');
  if (!el || !el.firstChild) return;
  el.style.transition = 'opacity .2s';
  el.style.opacity = '0';
  setTimeout(() => { el.innerHTML = ''; el.style.transition = ''; el.style.opacity = '1'; }, 220);
}

/* Move as camadas com uma transformação só. Nada é reconstruído aqui. */
function mapaTransformar() {
  const m = state.mapa;
  const camadas = document.getElementById('mapa-camadas');
  if (!camadas || !m.ref) return;
  const dx = m.ref[0] - (m.cx - m.larg / 2);
  const dy = m.ref[1] - (m.cy - m.alt / 2);
  camadas.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0)`;
}

/* Refaz a grade só quando o arraste se aproxima da borda dela. */
function mapaPrecisaRelayout() {
  const m = state.mapa;
  if (!m.grade) return true;
  const { passo, t0x, t1x, t0y, t1y } = m.grade;
  const orX = m.cx - m.larg / 2, orY = m.cy - m.alt / 2;
  const folga = Math.min(m.larg, m.alt) * 0.4;
  return orX - folga < t0x * passo || orX + m.larg + folga > (t1x + 1) * passo
      || orY - folga < t0y * passo || orY + m.alt + folga > (t1y + 1) * passo;
}

/* Só o marcador de posição, redesenhado quando o GPS atualiza. */
function mapaMarcador() {
  const m = state.mapa;
  const alvo = document.getElementById('mapa-eu');
  if (!alvo || !m.ref) return;
  if (!m.gps) { alvo.innerHTML = ''; return; }

  const [wx, wy] = lonLatParaPx(m.gps.lng, m.gps.lat, m.z);
  const x = wx - m.ref[0], y = wy - m.ref[1];
  const escPx = escalaPxPorMetro(m.gps.lat, m.z);
  const rAcc = Math.min((m.gps.acc || 0) * escPx, 4000);

  let out = '';
  if (rAcc > 5) out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rAcc.toFixed(1)}"
      fill="#2a78d6" fill-opacity="0.13" stroke="#2a78d6" stroke-opacity="0.45"
      stroke-width="1.5" stroke-dasharray="4 3"/>`;
  const rumo = (m.gps.rumo != null && isFinite(m.gps.rumo)) ? m.gps.rumo : null;
  if (rumo != null) {
    out += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rumo.toFixed(0)})">
      <path d="M0,-13 L8.5,9 L0,4.5 L-8.5,9 Z" fill="#2a78d6" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></g>`;
  } else {
    out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8.5" fill="#2a78d6" stroke="#fff" stroke-width="2.5"/>`;
  }
  alvo.innerHTML = out;
}

function mapaEscala() {
  const m = state.mapa;
  const el = document.getElementById('mapa-escala');
  if (!el) return;
  const lat = m.gps ? m.gps.lat : pxParaLonLat(m.cx, m.cy, m.z)[1];
  const mpp = 1 / escalaPxPorMetro(lat, m.z);
  const alvo = m.larg * 0.28 * mpp;
  const passo = [1,2,5,10,20,50,100,200,500,1000,2000,5000].find(v => v >= alvo) || 5000;
  el.innerHTML = `<span style="display:inline-block;border-bottom:2px solid #333;
    width:${(passo / mpp).toFixed(0)}px;vertical-align:middle;margin-right:5px;"></span>${passo >= 1000 ? (passo/1000)+' km' : passo+' m'}`;
}

/* Compatibilidade: quem chamava mapaDesenhar() continua funcionando. */
function mapaDesenhar() { mapaLayout(); }

function escalaPxPorMetro(lat, z) {
  const mppEq = 156543.03392 * Math.cos((lat || 0) * Math.PI / 180) / Math.pow(2, z);
  return 1 / mppEq;
}

/* ---------- leitura do GPS ----------
   Sem veredito de dentro ou fora: quem olha o mapa vê a seta em relação à
   linha, e o círculo de precisão mostra a dúvida sem que o app a nomeie.
   O que aparece aqui é o que o sensor informou, não interpretação. */
function mapaPainelSituacao() {
  const m = state.mapa;
  const alvo = document.getElementById('mapa-situacao');
  if (!alvo) return;

  if (m.erroGps) {
    alvo.innerHTML = `<div class="card" style="padding:11px 14px;margin-bottom:12px;border-left:3px solid var(--media);">
      <strong style="font-size:13.5px;">GPS indisponível</strong>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;">${esc(m.erroGps)}
      As poligonais continuam visíveis; só a sua posição não aparece.</div></div>`;
    return;
  }
  if (!m.gps) {
    alvo.innerHTML = `<div class="card" style="padding:11px 14px;margin-bottom:12px;">
      <span style="font-size:13.5px;">Buscando satélites…</span>
      <div style="font-size:12px;color:var(--ink-faint);margin-top:3px;">
      Sem rede a primeira fixação demora mais, porque não há assistência de rede para acelerar.</div></div>`;
    return;
  }

  const acc = m.gps.acc;
  const corAcc = acc == null ? 'var(--ink-faint)' : acc <= 10 ? 'var(--conforme)' : acc <= 25 ? 'var(--media)' : 'var(--nc)';
  alvo.innerHTML = `<div class="card" style="padding:11px 14px;margin-bottom:12px;">
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;">
      <span class="mono" style="font-size:13px;font-variant-numeric:tabular-nums;">
        ${m.gps.lat.toFixed(6)}, ${m.gps.lng.toFixed(6)}</span>
      <span style="font-size:12px;color:${corAcc};">precisão ${acc == null ? '—' : acc.toFixed(0) + ' m'}</span>
      ${m.gps.alt != null ? `<span style="font-size:12px;color:var(--ink-faint);">alt ${m.gps.alt.toFixed(0)} m</span>` : ''}
    </div>
    <div style="font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.5;">
      O círculo em volta da seta é a margem de erro do aparelho. Se ele encostar na linha da
      poligonal, a sua posição em relação ao limite não está resolvida.
    </div></div>`;
}

/* ============================================================
   EVENTOS
   ============================================================ */
function bindMapa() {
  const m = state.mapa;
  const palco = document.getElementById('mapa-palco');
  if (!palco) return;

  const sel = document.getElementById('mapa-emp');
  if (sel) sel.onchange = () => { m.empId = sel.value; mapaTrocarEmp(); };

  mapaPrepararGeos();
  if (!m.cx && !m.cy) mapaEnquadrar();
  mapaDesenhar();
  mapaIniciarGps();

  // ---- arrastar
  let arr = null;
  palco.onpointerdown = e => {
    arr = { x: e.clientX, y: e.clientY, cx: m.cx, cy: m.cy };
    palco.style.cursor = 'grabbing';
    palco.setPointerCapture(e.pointerId);
  };
  palco.onpointermove = e => {
    if (!arr) return;
    m.cx = arr.cx - (e.clientX - arr.x);
    m.cy = arr.cy - (e.clientY - arr.y);
    m.seguindo = false;
    // Um quadro por frame de tela, e só transformação. Sem isto, pointermove
    // dispara ~60 vezes por segundo e cada disparo refazia o DOM inteiro.
    if (!m.raf) m.raf = requestAnimationFrame(() => {
      m.raf = null;
      mapaTransformar();
      if (mapaPrecisaRelayout()) mapaLayout();
    });
  };
  palco.onpointerup = palco.onpointercancel = () => {
    if (arr) {
      arr = null; palco.style.cursor = 'grab';
      if (mapaPrecisaRelayout()) mapaLayout(); else { mapaTransformar(); mapaEscala(); }
      sincronizarBotoes();
    }
  };

  // ---- roda e pinça
  let ultimaRoda = 0;
  palco.onwheel = e => {
    e.preventDefault();
    const agora = Date.now();
    if (agora - ultimaRoda < 140) return;
    ultimaRoda = agora;
    mapaZoom(e.deltaY < 0 ? 1 : -1);
  };
  let dist0 = null, ultimoZoom = 0;
  palco.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { dist0 = toqueDist(e); arr = null; }
  }, { passive: true });
  palco.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || dist0 == null) return;
    const d = toqueDist(e), agora = Date.now();
    // Trava de 220 ms: sem ela a pinça dispara vários níveis em sequência e
    // cada um refaz a grade, o que trava o aparelho.
    if (agora - ultimoZoom < 220) return;
    if (d / dist0 > 1.3)       { mapaZoom(1);  dist0 = d; ultimoZoom = agora; }
    else if (d / dist0 < 0.77) { mapaZoom(-1); dist0 = d; ultimoZoom = agora; }
  }, { passive: true });
  palco.addEventListener('touchend', () => { dist0 = null; }, { passive: true });

  document.getElementById('mapa-zin').onclick  = () => mapaZoom(1);
  document.getElementById('mapa-zout').onclick = () => mapaZoom(-1);
  document.getElementById('mapa-caber').onclick = () => { m.seguindo = false; mapaEnquadrar(); mapaDesenhar(); sincronizarBotoes(); };
  document.getElementById('mapa-seguir').onclick = () => {
    m.seguindo = !m.seguindo;
    if (m.seguindo && m.gps) mapaCentrarEm(m.gps.lng, m.gps.lat);
    mapaDesenhar(); sincronizarBotoes();
  };
  document.getElementById('mapa-sat').onclick  = () => { m.satelite = !m.satelite; mapaLayout(); sincronizarBotoes(); };
  document.getElementById('mapa-fill').onclick = () => { m.reforcar = !m.reforcar; mapaLayout(); sincronizarBotoes(); };
}

function toqueDist(e) {
  const [a, b] = e.touches;
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

function sincronizarBotoes() {
  const m = state.mapa;
  const par = [['mapa-seguir', m.seguindo], ['mapa-sat', m.satelite], ['mapa-fill', m.reforcar]];
  par.forEach(([id, on]) => {
    const b = document.getElementById(id);
    if (!b) return;
    b.classList.toggle('primary', !!on);
    b.classList.toggle('ghost', !on);
  });
}

function mapaZoom(d) {
  const m = state.mapa;
  const z = Math.max(10, Math.min(MAPA_Z_MAX, m.z + d));
  if (z === m.z) return;
  const [lon, lat] = pxParaLonLat(m.cx, m.cy, m.z);
  m.z = z;
  [m.cx, m.cy] = lonLatParaPx(lon, lat, z);
  m.grade = null;                 // zoom sempre refaz a grade
  mapaLayout();
}

function mapaCentrarEm(lon, lat) {
  const m = state.mapa;
  [m.cx, m.cy] = lonLatParaPx(lon, lat, m.z);
}

function mapaEnquadrar() {
  const m = state.mapa;
  const palco = document.getElementById('mapa-palco');
  const larg = palco ? palco.clientWidth : 360, alt = palco ? palco.clientHeight : 340;
  if (!m.geos.length) return;
  const bb = bboxDe(m.geos);
  m.z = zoomParaCaber(bb, larg, alt);
  mapaCentrarEm((bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2);
}

function camadaVisivel(id) { return !state.mapa.off.has(id); }

function mapaPrepararGeos() {
  const m = state.mapa;
  const geos = [];
  poligonosDoEmp(m.empId).filter(p => camadaVisivel(p.id)).forEach(p => {
    (p.geojson || []).forEach(g => geos.push({ ...g, _tipo: p.tipo, _camada: p.nome, _id: p.id }));
  });
  m.geos = geos;
}

/* Liga e desliga camada sem refazer a tela toda: só o vetor muda. */
/* ---------- tela cheia ----------
   CSS puro, sem navegação: nada recarrega, e funciona igual offline. A API
   de Fullscreen do navegador é evitada de propósito, porque em iOS ela não
   cobre a barra do Safari e o comportamento varia entre versões. */
window.mapaTelaCheia = function (ligar) {
  const m = state.mapa;
  const palco = document.getElementById('mapa-palco');
  if (!palco) return;
  m.cheio = ligar == null ? !m.cheio : !!ligar;
  palco.classList.toggle('mapa-cheio', m.cheio);
  document.body.classList.toggle('sem-rolagem', m.cheio);
  const b = document.getElementById('mapa-expandir');
  if (b) b.innerHTML = m.cheio ? '&#10005;' : '&#9974;';
  if (b) b.title = m.cheio ? 'Fechar tela cheia' : 'Abrir em tela cheia';
  // A tela mudou de tamanho: a grade precisa ser refeita para o novo palco.
  m.grade = null;
  requestAnimationFrame(() => requestAnimationFrame(() => mapaLayout()));
};

/* ---------- baixar KML ----------
   Reconstrói o KML a partir da geometria guardada. Blob local, sem rede:
   funciona em campo, sem sinal. */
function geosParaKml(nome, itens) {
  const esc2 = t => String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const anel = a => `<coordinates>${a.map(([lo, la]) => `${lo},${la},0`).join(' ')}</coordinates>`;
  const corpo = itens.map(p => {
    const c = CORES_POLIGONO[p.tipo] || CORES_POLIGONO.outro;
    const desc = [
      c.rot,
      p.licenca_numero ? 'Licença ' + p.licenca_numero : null,
      p.protocolo_numero ? 'Protocolo ' + p.protocolo_numero : null,
      p.licenca_emissao ? 'Emissão ' + p.licenca_emissao : null,
      p.licenca_validade ? 'Validade ' + p.licenca_validade : null,
      p.protocolo_data ? 'Protocolada em ' + p.protocolo_data : null,
      c.peso || null
    ].filter(Boolean).join(' | ');
    return (p.geojson || []).map(g => {
      const geo = g.tipo === 'poligono'
        ? `<Polygon><outerBoundaryIs><LinearRing>${anel(g.aneis[0])}</LinearRing></outerBoundaryIs>` +
          g.aneis.slice(1).map(a => `<innerBoundaryIs><LinearRing>${anel(a)}</LinearRing></innerBoundaryIs>`).join('') +
          `</Polygon>`
        : g.tipo === 'linha' ? `<LineString>${anel(g.aneis[0])}</LineString>`
        : `<Point>${anel(g.aneis[0])}</Point>`;
      return `<Placemark><name>${esc2(p.nome)}</name><description>${esc2(desc)}</description>` +
             `<styleUrl>#e${p.tipo}</styleUrl>${geo}</Placemark>`;
    }).join('');
  }).join('');

  const estilos = [...new Set(itens.map(p => p.tipo))].map(t => {
    const c = CORES_POLIGONO[t] || CORES_POLIGONO.outro;
    // KML usa aabbggrr, ordem invertida em relação ao hexadecimal do CSS.
    const h = c.cor.replace('#', '');
    const abgr = 'ff' + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2);
    return `<Style id="e${t}"><LineStyle><color>${abgr}</color><width>2.5</width></LineStyle>` +
           `<PolyStyle><color>40${abgr.slice(2)}</color></PolyStyle></Style>`;
  }).join('');

  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>${esc2(nome)}</name>
<description>Exportado do MapaBase em ${new Date().toLocaleString('pt-BR')}. A poligonal desenhada é a que foi anexada ao cadastro; confira a licença vigente antes de tratar a linha como limite autorizado.</description>
${estilos}${corpo}
</Document></kml>`;
}

function baixarArquivo(nome, texto, tipo) {
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- GPS ----------
   watchPosition funciona offline: é hardware, não rede. Sem sinal a
   primeira fixação demora mais porque falta assistência de rede. */
function mapaIniciarGps() {
  const m = state.mapa;
  if (m.watchId != null) return;
  if (!navigator.geolocation) { m.erroGps = 'Este dispositivo não expõe geolocalização.'; mapaPainelSituacao(); return; }
  m.watchId = navigator.geolocation.watchPosition(
    pos => {
      m.erroGps = null;
      m.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude,
                acc: pos.coords.accuracy, alt: pos.coords.altitude,
                rumo: pos.coords.heading, vel: pos.coords.speed };
      if (m.seguindo) mapaCentrarEm(m.gps.lng, m.gps.lat);
      if (state.view === 'mapa') {
        // Atualização de GPS não precisa refazer tiles nem vetor.
        mapaMarcador();
        if (m.seguindo) { mapaTransformar(); if (mapaPrecisaRelayout()) mapaLayout(); }
        mapaPainelSituacao();
      }
    },
    err => {
      m.erroGps = err.code === 1 ? 'Permissão de localização negada no navegador.'
                : err.code === 3 ? 'Tempo esgotado ao buscar posição.'
                : 'Não foi possível obter a posição.';
      if (state.view === 'mapa') mapaPainelSituacao();
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
  );
}

function mapaPararGps() {
  const m = state.mapa;
  if (m.watchId != null) { navigator.geolocation.clearWatch(m.watchId); m.watchId = null; }
}

/* ============================================================
   ANEXAR KML NO CADASTRO DO EMPREENDIMENTO
   ============================================================ */
async function anexarKml(empId, arquivo, tipo, meta) {
  const texto = await arquivo.text();
  let geos = kmlParaGeo(texto);                    // lança se inválido
  const antes = contaVertices(geos);
  const r = simplificarGeos(geos, 1500);           // teto para não travar o SVG no celular
  geos = r.geos;
  const bb = bboxDe(geos);

  const reg = {
    id: 'pg' + uid(),
    empreendimento_id: empId,
    tipo,
    nome: meta.nome || arquivo.name.replace(/\.kml$/i, ''),
    geojson: geos,
    bbox: bb,
    n_vertices: contaVertices(geos),
    fonte: meta.fonte || null,
    licenca_numero: meta.licenca || null,
    licenca_emissao: meta.emissao || null,
    licenca_validade: meta.validade || null,
    protocolo_numero: meta.protocolo || null,
    protocolo_data: meta.protoData || null,
    arquivo_original: arquivo.name,
    observacao: r.simplificado
      ? `Poligonal simplificada na importação: ${antes} vértices no arquivo, ${contaVertices(geos)} armazenados, para não travar o desenho em celular. O arquivo original permanece a referência.`
      : null,
    ativo: true,
    criado_em: new Date().toISOString(),
    criado_por: (state.usuarioEmail || null)
  };

  state.poligonos = (state.poligonos || []).concat([reg]);
  await storageSet('poligonos', state.poligonos);
  if (_supabase && navigator.onLine) {
    const { error } = await _supabase.from('empreendimento_poligonos').insert(reg);
    if (error) throw new Error('Salvo no aparelho, mas falhou na nuvem: ' + error.message);
  }
  return { reg, simplificado: r.simplificado, antes };
}

async function removerKml(id) {
  state.poligonos = (state.poligonos || []).filter(p => p.id !== id);
  await storageSet('poligonos', state.poligonos);
  if (_supabase && navigator.onLine) {

  }
}

/* ============================================================
   SINCRO E DADOS NUVEM
   ============================================================ */
async function syncGlobalNuvem() {
  if(!_supabase || !navigator.onLine) return false;
  
  try {
    const [empReq, estReq] = await Promise.all([
      _supabase.from('empreendimentos').select('*'),
      _supabase.from('estruturas').select('*')
    ]);
    
    if(empReq.data && empReq.data.length > 0) {
      state.empreendimentos = empReq.data.map(d => ({
        id: d.id, 
        nome: d.nome, 
        tipo: d.tipo, 
        estruturas: d.estruturas, 
        logo: d.logo || null,
        criadoEm: d.criado_em || null,
        criadoPor: d.criado_por || null,
        atualizadoEm: d.atualizado_em || null,
        atualizadoPor: d.atualizado_por || null
      }));
      await storageSet('empreendimentos', state.empreendimentos);
    }
    
    if(estReq.data && estReq.data.length > 0) {
      state.estruturas = estReq.data.map(d => {
        let listItens = [];
        let setorVal = d.setor;

        const defRef = DEFAULT_ESTRUTURAS.find(x => x.nome === d.nome || x.id === d.id);
        if (defRef && (!setorVal || (setorVal === 'Geral' && defRef.setor !== 'Geral'))) {
          setorVal = defRef.setor;
        } else if (!setorVal) {
          setorVal = 'Geral';
        }

        if (Array.isArray(d.itens)) {
          listItens = d.itens;
        } else if (d.itens && typeof d.itens === 'object') {
          listItens = d.itens.list || [];
          if (d.itens.setor && (!setorVal || setorVal === 'Geral')) {
            setorVal = d.itens.setor;
          }
        }
        
        return { 
          id: d.id, 
          nome: d.nome, 
          setor: setorVal, 
          itens: listItens,
          criadoEm: d.criado_em || null,
          criadoPor: d.criado_por || null,
          atualizadoEm: d.atualizado_em || null,
          atualizadoPor: d.atualizado_por || null
        };
      });
      await storageSet('estruturas', state.estruturas);
    }
    
    await loadVistoriasNuvem();
    return true;
  } catch(e) { 
    return false; 
  }
}

async function loadVistoriasNuvem() {
  let localIndex = (await storageGet('vistorias:index')) || [];
  
  if(_supabase && navigator.onLine) {
    try {
      const { data } = await _supabase.from('vistorias').select('id, empreendimento_nome, estrutura_nome, equipe, responsavel, data_hora, atualizado_em, total_itens, total_nc, criticidade_max, criticidades_map');
      
      if(data) {
        const cloudMap = {};
        
        data.forEach(d => {
          const rawMap = d.criticidades_map || {};
          const { _categorias, _na, _ncs, ...pureCrit } = rawMap;

          cloudMap[d.id] = {
            id: d.id, 
            empreendimentoNome: d.empreendimento_nome, 
            estruturaNome: d.estrutura_nome,
            equipe: d.equipe || '',
            responsavel: d.responsavel, 
            dataHora: d.data_hora, 
            atualizadoEm: d.atualizado_em || null,
            totalItens: d.total_itens,
            totalNC: d.total_nc, 
            totalNA: _na || 0,
            ncsResumo: _ncs || [],
            criticidadeMax: d.criticidade_max, 
            syncStatus: 'synced',
            criticidades: pureCrit,
            categorias: _categorias || {} 
          };
        });
        
        localIndex.forEach(lv => { 
          if(lv.syncStatus === 'pending') {
            cloudMap[lv.id] = lv; 
          }
        });
        
        state.vistoriasIndex = Object.values(cloudMap);
        separarLixeira();
        await salvarIndice();
      }
    } catch(e) {
      console.error("Erro no load vistorias nuvem:", e);
    }
  } else {
    state.vistoriasIndex = localIndex;
    separarLixeira();
  }
}

async function loadVistoria(id) {
  try {
    // A cópia local PENDENTE é sempre a mais recente: é uma edição/criação que
    // ainda não foi confirmada na nuvem. Nesse caso, usamos a local e NÃO
    // sobrescrevemos com a versão da nuvem (que está atrasada). Isso vale
    // inclusive durante a sincronização, que também chama esta função.
    const localExistente = await storageGet('vistoria:' + id);
    const idxEntry = state.vistoriasIndex.find(x => x.id === id);
    const estaPendente = (localExistente && localExistente.syncStatus === 'pending') || (idxEntry && idxEntry.syncStatus === 'pending');
    if (estaPendente && localExistente) {
      return localExistente;
    }

    if (_supabase && navigator.onLine) {
      const { data, error } = await _supabase.from('vistorias').select('*').eq('id', id).single();
      
      if (!error && data) {
        let itensParsed = typeof data.itens === 'string' ? JSON.parse(data.itens) : data.itens;
        let gpsParsed  = typeof data.gps  === 'string' ? JSON.parse(data.gps)  : data.gps;
        let critMap    = typeof data.criticidades_map === 'string' ? JSON.parse(data.criticidades_map) : data.criticidades_map;
        
        const v = {
          id: data.id, 
          empreendimentoNome: data.empreendimento_nome, 
          estruturaNome: data.estrutura_nome,
          equipe: data.equipe || '',
          responsavel: data.responsavel, 
          dataHora: data.data_hora, 
          gps: gpsParsed,
          itens: Array.isArray(itensParsed) ? itensParsed : [], 
          observacaoGeral: (data.observacao_geral != null && data.observacao_geral !== '') ? data.observacao_geral : ((critMap && critMap._obsGeral) ? critMap._obsGeral : ''), 
          atualizadoEm: data.atualizado_em || null,
          syncStatus: 'synced'
        };
        
        await storageSet('vistoria:' + id, v);  
        return v;
      }
    }
    
    const local = await storageGet('vistoria:' + id);
    if (local) return local;
    
    showToast('Relatório indisponível offline neste aparelho.');
  } catch(e) {
    const local = await storageGet('vistoria:' + id);
    if (local) return local;
    showToast('Falha ao carregar: ' + e.message);
  }
  
  return null;
}

window.sincronizarPendentes = async function() {
  if(_sincronizandoPendentes) return; // evita execuções simultâneas
  if(!navigator.onLine) { showToast('Sem conexão!'); return; }
  const pendentes = state.vistoriasIndex.filter(v => v.syncStatus === 'pending');
  if(pendentes.length === 0) { showToast('Nenhum check-list pendente.'); return; }
  
  _sincronizandoPendentes = true;
  showToast(`Sincronizando ${pendentes.length}...`);
  let successCount = 0;

  try {

  for(let p of pendentes) {
    const v = await loadVistoria(p.id);
    if(v) {
      // Sobe as fotos (base64 -> Storage) antes de enviar a vistoria.
      const todasFotos = await subirFotosDaVistoria(v);
      const analise = analisarCriticidade(v.itens);

      const { error } = await _supabase.from('vistorias').upsert({
        id: v.id, 
        empreendimento_nome: v.empreendimentoNome, 
        estrutura_nome: v.estruturaNome,
        equipe: v.equipe || '',
        responsavel: v.responsavel, 
        data_hora: v.dataHora, 
        gps: v.gps, 
        itens: v.itens,
        total_itens: v.itens.length, 
        total_nc: v.itens.filter(i => i.status === 'nc').length,
        criticidade_max: analise.critMax,
        observacao_geral: v.observacaoGeral || '',
        atualizado_em: v.atualizadoEm || new Date().toISOString(),
        criticidades_map: { 
          ...analise.counts, 
          _categorias: analise.categorias, 
          _na: analise.totalNA, 
          _ncs: analise.ncsResumo
        }
      });
      
      if(!error) {
        // Só vira "synced" quando todas as fotos já subiram; senão continua
        // pendente para tentar subir o restante na próxima sincronização.
        const novoStatus = todasFotos ? 'synced' : 'pending';
        v.syncStatus = novoStatus; 
        p.syncStatus = novoStatus;
        p.equipe = v.equipe || '';
        p.criticidades = analise.counts;
        p.categorias = analise.categorias;
        p.totalNA = analise.totalNA;
        p.ncsResumo = analise.ncsResumo || [];
        p.criticidadeMax = analise.critMax;
        p.atualizadoEm = v.atualizadoEm || p.atualizadoEm;

        await storageSet('vistoria:' + v.id, v);
        if (novoStatus === 'synced') successCount++;
      }
    }
  }
  await salvarIndice();
  render();
  showToast(`${successCount} sincronizados!`);
  } finally {
    _sincronizandoPendentes = false;
  }
};

async function saveVistoria(v) {
  const analise = analisarCriticidade(v.itens);

  // Carimbo de última edição/salvamento (data e hora em que foi concluído/editado).
  v.atualizadoEm = new Date().toISOString();

  // 1) Salva LOCALMENTE na hora, como pendente. Rápido e sem depender da rede —
  //    é o que faz o "Concluir" ser instantâneo mesmo com fotos pesadas.
  v.syncStatus = 'pending';

  const idxData = {
    id: v.id, 
    empreendimentoNome: v.empreendimentoNome, 
    estruturaNome: v.estruturaNome,
    equipe: v.equipe || '',
    responsavel: v.responsavel, 
    dataHora: v.dataHora,
    atualizadoEm: v.atualizadoEm,
    totalNC: v.itens.filter(i => i.status === 'nc').length,
    totalNA: analise.totalNA,
    ncsResumo: analise.ncsResumo || [],
    totalItens: v.itens.length,
    criticidades: analise.counts,
    categorias: analise.categorias,
    criticidadeMax: analise.critMax,
    syncStatus: v.syncStatus
  };

  const idx = state.vistoriasIndex.findIndex(x => x.id === v.id);
  if (idx >= 0) state.vistoriasIndex[idx] = idxData;
  else state.vistoriasIndex.push(idxData);

  await salvarIndice();
  await storageSet('vistoria:' + v.id, v);
  registrarCategorias(v.itens);

  // 2) Sobe para a nuvem em SEGUNDO PLANO (sem travar). O envio das fotos
  //    acontece por trás; a vistoria troca de "⏳ Local" para "✅ Nuvem"
  //    quando terminar. Offline, fica pendente e sobe sozinha ao reconectar.
  if (navigator.onLine && _supabase) {
    showToast('Salvo! Enviando para a nuvem em segundo plano...');
    sincronizarPendentes();
  } else {
    showToast('Salvo no aparelho. Sincroniza quando houver internet.');
  }
}

/* ============================================================
   FILTRO DE LISTA — padrão reaproveitável
   ------------------------------------------------------------
   Filtra no DOM, sem re-renderizar a tela. Isso não é detalhe: re-render a
   cada tecla faz o campo perder o foco e o teclado do celular fechar. Aqui
   os cartões já estão na página e só somem ou aparecem.

   Cada item ganha data-filtro (escopo), data-busca (texto normalizado) e
   data-grupo (setor ou tipo). Cabeçalho de seção vazia se esconde sozinho.
   ============================================================ */
/* Carimbo de data para cartão de cadastro. Ausência é declarada, não
   escondida: as 35 estruturas anteriores a 04/08/2026 não têm data real, e
   preencher com "hoje" mostraria "criado hoje" para algo semeado semanas
   atrás. Melhor dizer que não há registro. */
function carimboCadastro(criadoEm, atualizadoEm, criadoPor, atualizadoPor) {
  const linha = (ic, rot, iso, quem) => `
    <div style="display:flex;gap:6px;align-items:baseline;">
      <span style="opacity:.6;flex:none;">${ic}</span>
      <span>${rot} <strong style="font-weight:600;">${esc(fmtDate(iso))}</strong>${
        quem ? `<br><span style="opacity:.75;">${esc(quem)}</span>` : ''}</span>
    </div>`;

  const partes = [];
  if (atualizadoEm) partes.push(linha('&#9998;', 'Editado', atualizadoEm, atualizadoPor));
  if (criadoEm) partes.push(linha('&#43;', 'Criado', criadoEm, criadoPor));
  if (!partes.length) partes.push(`
    <div style="display:flex;gap:6px;align-items:baseline;">
      <span style="opacity:.6;flex:none;">&#8211;</span>
      <span title="Registro anterior ao carimbo de data. A data real é desconhecida e não foi inventada.">Data não registrada</span>
    </div>`);

  return `<div class="carimbo">${partes.join('')}</div>`;
}

function normalizar(t) {
  return String(t == null ? '' : t).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/* Busca sem acento nos dois lados: em campo, com uma mão e sol na tela,
   ninguém digita "mineração" com til. */
function casaBusca(termo, ...campos) {
  const q = normalizar(termo).trim();
  if (!q) return true;
  const alvo = normalizar(campos.filter(Boolean).join(' '));
  return q.split(/\s+/).every(parte => alvo.includes(parte));
}

function caixaFiltro(escopo, dica, grupos, total) {
  return `
  <div class="filtro-box">
    <div class="filtro-campo">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="${escopo}-busca" placeholder="${esc(dica)}"
             autocomplete="off" oninput="filtroAplicar('${escopo}')">
      <button type="button" class="filtro-limpar" id="${escopo}-limpar"
              onclick="filtroLimpar('${escopo}')" title="Limpar busca" hidden>&#10005;</button>
    </div>
    ${grupos && grupos.length ? `
      <div class="filtro-chips">
        <button type="button" class="chip on" data-filtro-grupo="${escopo}" data-valor=""
                onclick="filtroGrupo('${escopo}', this)">Todos</button>
        ${grupos.map(g => `

window.filtroGrupo = function (escopo, bt) {
  document.querySelectorAll(`[data-filtro-grupo="${escopo}"]`).forEach(b => b.classList.remove('on'));
  bt.classList.add('on');
  filtroAplicar(escopo);
};

window.filtroLimpar = function (escopo) {
  const cx = document.getElementById(escopo + '-busca');
  if (cx) { cx.value = ''; cx.focus(); }
  filtroAplicar(escopo);
};

window.filtroAplicar = function (escopo) {
  const cx = document.getElementById(escopo + '-busca');
  const q = cx ? cx.value : '';
  const bt = document.getElementById(escopo + '-limpar');
  if (bt) bt.hidden = !q;

  const sel = document.querySelector(`[data-filtro-grupo="${escopo}"].on`);
  const grupo = sel ? sel.getAttribute('data-valor') : '';

  let n = 0;
  document.querySelectorAll(`[data-filtro="${escopo}"]`).forEach(el => {
    const okQ = casaBusca(q, el.getAttribute('data-busca'));
    const okG = !grupo || (el.getAttribute('data-grupo') || '') === grupo;
    const on = okQ && okG;
    el.style.display = on ? '' : 'none';
    if (on) n++;
  });

  // Seção sem nenhum item visível desaparece junto do cabeçalho.
  document.querySelectorAll(`[data-secao="${escopo}"]`).forEach(sec => {
    const v = sec.getAttribute('data-valor');
    const vis = Array.from(document.querySelectorAll(`[data-filtro="${escopo}"][data-grupo="${v}"]`))
      .filter(el => el.style.display !== 'none').length;
    sec.style.display = vis ? '' : 'none';
  });
  document.querySelectorAll(`[data-grade="${escopo}"]`).forEach(gr => {
    const v = gr.getAttribute('data-valor');
    const vis = Array.from(gr.querySelectorAll(`[data-filtro="${escopo}"]`))
      .filter(el => el.style.display !== 'none').length;
    gr.style.display = vis ? '' : 'none';
  });

  const c = document.getElementById(escopo + '-conta');
  if (c) c.textContent = n === 0 ? 'nada encontrado' : `${n} ${n === 1 ? 'item' : 'itens'}`;
  const vz = document.getElementById(escopo + '-vazio');
  if (vz) vz.style.display = n === 0 ? '' : 'none';
};

// Reduz a logo do empreendimento para ~240px sobre fundo branco (leve, embutida).
function comprimirLogo(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 240;
        let w = img.width, h = img.height;
        const escala = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * escala); h = Math.round(h * escala);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        <div class="field">

            <input type="search" id="vinc-busca" placeholder="Buscar entre ${state.estruturas.length} estruturas..."
                   autocomplete="off" oninput="filtroAplicar('vinc')">
            <button type="button" class="filtro-limpar" id="vinc-limpar" onclick="filtroLimpar('vinc')" hidden>&#10005;</button>
          </div>
          <div style="max-height:230px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:6px; background:#fafbf9;">
            ${state.estruturas.map(est => `
              <label class="vinc-item" data-filtro="vinc"
                     data-busca="${esc(est.nome + ' ' + (est.setor || 'Geral'))}">
                <input type="checkbox" class="mod-emp-est" value="${esc(est.id)}" ${(vinculadas.includes(est.id) || vinculadas.includes(est.nome)) ? 'checked' : ''}>
                <span class="vinc-txt">${esc(est.nome)}</span>
                <span class="vinc-setor">${esc(est.setor || 'Geral')}</span>
              </label>
            `).join('')}

        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" id="btn-save-emp">${isEdit ? 'Salvar Alterações' : 'Criar Empreendimento'}</button>
      </div>
    </div>
  </div>`;
  
  document.getElementById('modal-root').innerHTML = html;

  document.getElementById('emp-logo-file').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    showToast('Processando logo...');
    try {
      logoAtual = await comprimirLogo(file);
      document.getElementById('emp-logo-preview').innerHTML = `<img src="${logoAtual}" style="max-width:100%;max-height:100%;object-fit:contain;">`;
      document.getElementById('emp-logo-remover').style.display = '';
    } catch (e) { showToast('Não consegui processar a imagem.'); }
  });
  document.getElementById('emp-logo-remover').addEventListener('click', () => {
    logoAtual = '';
    document.getElementById('emp-logo-preview').innerHTML = '<span style="font-size:10.5px;color:var(--ink-faint);">sem logo</span>';
    document.getElementById('emp-logo-remover').style.display = 'none';
  });
  
  function ligarKml() {
    document.querySelectorAll('[data-kml-rm]').forEach(b => {
      b.onclick = async () => {
        if (!confirm('Remover esta poligonal? Ela deixa de aparecer no mapa.')) return;
        await removerKml(b.getAttribute('data-kml-rm'));
        document.getElementById('emp-kml-lista').innerHTML = listaKmlHtml(id);
        ligarKml();
        if (state.view === 'mapa') { mapaPrepararGeos(); mapaLayout(); }
        showToast('Poligonal removida.');
      };
    });
    document.querySelectorAll('[data-kml-ed]').forEach(b => {
      b.onclick = () => {
        const pol = (state.poligonos || []).find(x => x.id === b.getAttribute('data-kml-ed'));
        if (pol) modoEdicao(pol);
      };
    });
  }
  ligarKml();

  /* O rótulo do campo muda com o tipo: numa ADA protocolada não existe número
     de licença, e pedir "Nº da licença" convida a inventar um. */
  function ajustarPorTipo() {
    const t = document.getElementById('emp-kml-tipo').value;
    const c = CORES_POLIGONO[t] || CORES_POLIGONO.outro;
    const g = corDoGrupo(c.grupo);
    const prot = t === 'ada_protocolada';

    document.getElementById('emp-kml-lic-lab').textContent = prot ? 'Nº do protocolo' : 'Nº da licença';
    document.getElementById('emp-kml-lic').placeholder = prot ? '12345/2026' : 'LO 1234/2024';
    document.getElementById('emp-kml-emissao-lab').textContent = prot ? 'Data do protocolo' : 'Emissão';
    // Protocolo não tem validade: o campo sai de cena em vez de ficar vazio.
    document.getElementById('emp-kml-val-wrap').style.display = prot ? 'none' : '';

    const ico = c.grupo === 'autorizada' ? '✓' : c.grupo === 'pendente' ? '!' : 'i';
    document.getElementById('emp-kml-peso').innerHTML = c.peso
      ? `<div class="kml-peso" style="color:${g.fg};background:${g.bg};">
           <span class="ic">${ico}</span><span>${esc(c.peso)}</span></div>`
      : '';
  }
  document.getElementById('emp-kml-tipo')?.addEventListener('change', ajustarPorTipo);
  ajustarPorTipo();

  /* Edição acontece no mesmo formulário, em modo diferente. Modal dentro de
     modal é ruim de fechar no celular, e a lista já está logo acima. */
  let kmlEditando = null;

  function modoEdicao(pol) {
    kmlEditando = pol ? pol.id : null;
    const acoes = document.getElementById('emp-kml-acoes');
    const txt = document.getElementById('emp-kml-anexar-txt');
    if (pol) {
      const prot = pol.tipo === 'ada_protocolada';
      document.getElementById('emp-kml-tipo').value = pol.tipo;
      document.getElementById('emp-kml-nome').value = pol.nome || '';
      document.getElementById('emp-kml-lic').value = (prot ? pol.protocolo_numero : pol.licenca_numero) || '';
      document.getElementById('emp-kml-emissao').value = (prot ? pol.protocolo_data : pol.licenca_emissao) || '';
      document.getElementById('emp-kml-validade').value = pol.licenca_validade || '';
      ajustarPorTipo();
      acoes.style.display = 'flex';
      txt.textContent = 'Substituir o arquivo .kml (opcional)';
      document.getElementById('emp-kml-msg').innerHTML =
        `Editando <strong>${esc(pol.nome)}</strong>. Alterar tipo, licença ou datas não mexe na geometria.
         Se a poligonal foi redesenhada, substitua o arquivo.`;
    } else {
      acoes.style.display = 'none';
      txt.textContent = 'Anexar arquivo .kml';
      ['emp-kml-nome','emp-kml-lic','emp-kml-emissao','emp-kml-validade'].forEach(x => {
        const el = document.getElementById(x); if (el) el.value = '';
      });
      document.getElementById('emp-kml-tipo').value = 'ada_licenciada';
      ajustarPorTipo();
      document.getElementById('emp-kml-msg').innerHTML =
        'Exporte como <strong>KML</strong> no Google Earth Pro, não KMZ. O arquivo é lido no aparelho e fica disponível offline.';
    }
  }

  document.getElementById('emp-kml-cancelar').onclick = () => modoEdicao(null);

  document.getElementById('emp-kml-salvar').onclick = async () => {
    const pol = (state.poligonos || []).find(x => x.id === kmlEditando);
    const msg = document.getElementById('emp-kml-msg');
    if (!pol) return modoEdicao(null);

    const t = document.getElementById('emp-kml-tipo').value;
    const prot = t === 'ada_protocolada';
    const num = document.getElementById('emp-kml-lic').value.trim() || null;
    const dt  = document.getElementById('emp-kml-emissao').value || null;

    const novo = {
      tipo: t,
      nome: document.getElementById('emp-kml-nome').value.trim() || pol.nome,
      licenca_numero:   prot ? null : num,
      licenca_emissao:  prot ? null : dt,
      licenca_validade: prot ? null : (document.getElementById('emp-kml-validade').value || null),
      protocolo_numero: prot ? num : null,
      protocolo_data:   prot ? dt : null
    };

    const antes = {}, depois = {};
    Object.keys(novo).forEach(k => {
      const a = pol[k] == null ? null : pol[k];
      const b = novo[k] == null ? null : novo[k];
      if (String(a) !== String(b)) { antes[k] = a; depois[k] = b; }
    });
    if (!Object.keys(depois).length) { msg.textContent = 'Nada foi alterado.'; return; }

    const promovida = antes.tipo === 'ada_protocolada' && depois.tipo === 'ada_licenciada';
    const hist = (Array.isArray(pol.historico) ? pol.historico.slice() : []);
    hist.push({ em: new Date().toISOString(), por: (state.usuarioEmail || null), antes, depois });

    const patch = Object.assign({}, novo, {
      historico: hist,
      atualizado_em: new Date().toISOString(),
      atualizado_por: (state.usuarioEmail || null)
    });

    Object.assign(pol, patch);
    await storageSet('poligonos', state.poligonos);
    if (_supabase && navigator.onLine) {
      const { error } = await _supabase.from('empreendimento_poligonos').update(patch).eq('id', pol.id);
      if (error) { msg.innerHTML = `<strong style="color:var(--nc);">Salvo no aparelho, falhou na nuvem:</strong> ${esc(error.message)}`; return; }
    }

    document.getElementById('emp-kml-lista').innerHTML = listaKmlHtml(id);
    ligarKml();
    modoEdicao(null);
    msg.innerHTML = promovida
      ? `<strong style="color:var(--conforme);">Promovida a ADA licenciada.</strong> A linha deixa de sair
         tracejada no mapa e passa a valer como limite autorizado. A troca ficou registrada no histórico,
         com data. Se a licença redesenhou a área, substitua o arquivo e marque a anterior como
         <em>ADA de licença antiga</em>.`
      : `<strong style="color:var(--conforme);">Alterações salvas.</strong> ${Object.keys(depois).length} campo(s).`;

    if (state.view === 'mapa') { mapaPrepararGeos(); mapaLayout(); }
  };

  document.getElementById('emp-kml-file')?.addEventListener('change', async (ev) => {
    const arq = ev.target.files[0];
    if (!arq) return;
    const msg = document.getElementById('emp-kml-msg');
    msg.textContent = 'Lendo arquivo…';
    try {
      // Em modo edição o arquivo substitui a geometria e mantém o registro.
      if (kmlEditando) {
        const pol = (state.poligonos || []).find(x => x.id === kmlEditando);
        if (pol) {
          const texto = await arq.text();
          const g0 = kmlParaGeo(texto);
          const antesV = contaVertices(g0);
          const r0 = simplificarGeos(g0, 1500);
          const patchG = {
            geojson: r0.geos, bbox: bboxDe(r0.geos), n_vertices: contaVertices(r0.geos),
            arquivo_original: arq.name,
            historico: (Array.isArray(pol.historico) ? pol.historico : []).concat([{
              em: new Date().toISOString(), por: (state.usuarioEmail || null),
              antes: { n_vertices: pol.n_vertices, arquivo_original: pol.arquivo_original },
              depois: { n_vertices: contaVertices(r0.geos), arquivo_original: arq.name }
            }]),
            atualizado_em: new Date().toISOString(), atualizado_por: (state.usuarioEmail || null)
          };
          Object.assign(pol, patchG);
          await storageSet('poligonos', state.poligonos);
          if (_supabase && navigator.onLine) await _supabase.from('empreendimento_poligonos').update(patchG).eq('id', pol.id);
          document.getElementById('emp-kml-lista').innerHTML = listaKmlHtml(id);
          ligarKml();
          msg.innerHTML = `<strong style="color:var(--conforme);">Geometria substituída.</strong>
            ${patchG.n_vertices} vértices.` + (r0.simplificado ? ` O arquivo tinha ${antesV} e foi simplificado.` : '');
          ev.target.value = '';
          if (state.view === 'mapa') { mapaPrepararGeos(); mapaLayout(); }
          return;
        }
      }

      const tipoSel = document.getElementById('emp-kml-tipo').value;
      const prot = tipoSel === 'ada_protocolada';
      const num = document.getElementById('emp-kml-lic').value.trim() || null;
      const dt  = document.getElementById('emp-kml-emissao').value || null;
      const r = await anexarKml(id, arq, tipoSel, {
        nome:      document.getElementById('emp-kml-nome').value.trim() || null,
        licenca:   prot ? null : num,
        emissao:   prot ? null : dt,
        validade:  prot ? null : (document.getElementById('emp-kml-validade').value || null),
        protocolo: prot ? num : null,
        protoData: prot ? dt : null
      });
      document.getElementById('emp-kml-lista').innerHTML = listaKmlHtml(id);
      ligarKml();
      const bb = r.reg.bbox;
      const km = (Math.abs(bb[2]-bb[0]) * 111.32 * Math.cos(bb[1]*Math.PI/180)).toFixed(2);
      const kmY = (Math.abs(bb[3]-bb[1]) * 111.32).toFixed(2);
      msg.innerHTML = `<strong style="color:var(--conforme);">Anexado.</strong> ${r.reg.n_vertices} vértices,
        extensão aproximada de ${km} × ${kmY} km. Confira se bate com a área esperada.` +
        (r.simplificado ? ` O arquivo tinha ${r.antes} vértices e foi simplificado para não travar o desenho no celular.` : '');
      ev.target.value = '';
      document.getElementById('emp-kml-nome').value = '';
      document.getElementById('emp-kml-lic').value = '';
    } catch (e) {
      msg.innerHTML = `<strong style="color:var(--nc);">Não foi possível ler:</strong> ${esc(e.message)}`;
      ev.target.value = '';
    }
  });

  document.getElementById('btn-save-emp').addEventListener('click', async () => {
    const novoNome = document.getElementById('mod-emp-nome').value.trim();
    const novoTipo = document.getElementById('mod-emp-tipo').value;
    const novasVinculadas = Array.from(document.querySelectorAll('.mod-emp-est:checked')).map(cb => cb.value);
    
    if(!novoNome) {
      return showToast('O Nome é obrigatório');
    }
    
    const obj = { 
      id, 
      nome: novoNome, 
      tipo: novoTipo, 
      estruturas: novasVinculadas, 
      logo: logoAtual || null,
      criado_em: isEdit ? (empExistente.criadoEm || empExistente.criado_em || null) : new Date().toISOString(),
      criado_por: isEdit ? (empExistente.criadoPor || null) : (state.usuarioEmail || null),
      atualizado_em: isEdit ? new Date().toISOString() : null,
      atualizado_por: isEdit ? (state.usuarioEmail || null) : null 
    };
    
    if(isEdit) {
      const idx = state.empreendimentos.findIndex(e => e.id === id);
      state.empreendimentos[idx] = obj;
    } else {
      state.empreendimentos.push(obj);
    }

    await storageSet('empreendimentos', state.empreendimentos);
    if(_supabase && navigator.onLine) {
      await _supabase.from('empreendimentos').upsert(obj);
    }
    
    closeModal(); 
    render(); 
    showToast('Empreendimento salvo com sucesso!');
  });
}

window.excluirEmpreendimento = async function(id) {

    state.empreendimentos = state.empreendimentos.filter(e => e.id !== id);

    render();
  }

function viewEstruturas() {
  if(state.estruturaEditando) return viewEditorEstrutura();

  const setoresDef = [
    { id: 'Geral', title: 'Setor Geral / Misto' },
    { id: 'Mineração', title: 'Mineração e Processamento' },
    { id: 'Agro', title: 'Agronegócio e Criação' },
    { id: 'Indústrias', title: 'Indústrias e Manufatura' }
  ];

  let html = `
  <div class="view-head">
    <div>
      <div class="eyebrow">Biblioteca</div>
      <h1 class="view-title">Estruturas de Inspeção</h1>
    </div>
    <button class="btn primary" id="btn-add-est">+ Nova Estrutura</button>
  </div>`;

  const contaSetor = id => state.estruturas.filter(e => (e.setor || 'Geral') === id).length;
  html += caixaFiltro('est', 'Buscar estrutura, item ou setor...',
    setoresDef.filter(x => contaSetor(x.id)).map(x => ({ valor: x.id, rot: x.id, n: contaSetor(x.id) })),
    state.estruturas.length);
  html += `<div class="empty card" id="est-vazio" style="display:none;">
    <div class="ic">&#128269;</div>Nenhuma estrutura corresponde à busca.</div>`;

  if(state.estruturas.length === 0) {
    return html + `
      <div class="empty card">
        <div class="ic">🏗️</div>Nenhuma estrutura cadastrada na biblioteca.
      </div>`;
  }

  setoresDef.forEach(setor => {
    const ests = state.estruturas.filter(e => (e.setor || 'Geral') === setor.id);
    if(ests.length > 0) {
      html += `
      <div class="sector-header" data-secao="est" data-valor="${esc(setor.id)}">
        <div class="sector-icon">${iconeSetor(setor.id)}</div>
        <h2 class="sector-title">${setor.title}</h2>
      </div>
      <div class="grid cols-3" data-grade="est" data-valor="${esc(setor.id)}">
        ${ests.map(e => `
          <div class="visual-card" data-filtro="est" data-grupo="${esc(setor.id)}"
               data-busca="${esc(e.nome + ' ' + (setor.id) + ' ' + (e.itens || []).map(i => i.nome || i.item || '').join(' '))}">
            <div class="visual-card-body">
              <h3 class="visual-card-title">${esc(e.nome)}</h3>
              <div class="visual-card-desc" style="margin-top: 8px;">
                ${(e.itens || []).length} itens de verificação no checklist.
              </div>
              ${carimboCadastro(e.criadoEm, e.atualizadoEm, e.criadoPor, e.atualizadoPor)}
            </div>
            <div class="visual-card-foot">
              <button class="btn ghost sm" onclick="editarEstrutura('${e.id}')">✏️ Editar</button>
              <button class="btn ghost sm" onclick="duplicarEstrutura('${e.id}')">📋 Duplicar</button>
              <button class="btn ghost sm danger" onclick="excluirEstrutura('${e.id}')">✕</button>
            </div>
          </div>
        `).join('')}
      </div>`;
    }
  });

  return html;
}

function bindEstruturas() {
  if(state.estruturaEditando) return bindEditorEstrutura();

  document.getElementById('btn-add-est')?.addEventListener('click', () => {
    state.estruturaEditando = { id: uid(), nome: 'Nova Estrutura', setor: 'Geral', itens: [] };
    render();
  });
}

window.editarEstrutura = function(id) {
  const est = state.estruturas.find(e => e.id === id);
  if(est) { 
    state.estruturaEditando = JSON.parse(JSON.stringify(est)); 
    render(); 
  }
}

window.duplicarEstrutura = async function(id) {
  const est = state.estruturas.find(e => e.id === id);
  if(est) {
    const clone = JSON.parse(JSON.stringify(est));
    clone.id = uid();
    clone.nome = clone.nome + ' (Cópia)';
    clone.itens = clone.itens.map(i => ({...i, id: uid()}));
    clone.criadoEm = new Date().toISOString();
    clone.criadoPor = state.usuarioEmail || null;
    delete clone.atualizadoEm; delete clone.atualizadoPor;
    
    state.estruturas.push(clone);
    await storageSet('estruturas', state.estruturas);
    
    if(_supabase && navigator.onLine) {
      await _supabase.from('estruturas').upsert({
        id: clone.id,
        nome: clone.nome,
        setor: clone.setor,
        itens: { setor: clone.setor, list: clone.itens },
        criado_em: clone.criadoEm,
        criado_por: clone.criadoPor
      });
    }
    
    render(); 
    showToast('Estrutura duplicada na nuvem e local!');
  }
}

window.excluirEstrutura = async function(id) {
  if(confirm('Tem certeza? Essa exclusão afetará novos check-lists (os antigos mantêm o histórico salvo).')) {
    state.estruturas = state.estruturas.filter(e => e.id !== id);
    await storageSet('estruturas', state.estruturas);
    
    if(_supabase && navigator.onLine) {
      await _supabase.from('estruturas').delete().eq('id', id);
    }
    
    render();
  }
}

  return `
  <div class="view-head no-print">

      <h1 class="view-title">Montar Checklist: ${esc(est.nome)}</h1>

function bindEditorEstrutura() {
  document.getElementById('btn-ed-add-item')?.addEventListener('click', () => {
    state.estruturaEditando.itens.push({ id: uid(), texto: '', categoria: '' });
    render();
  });

  document.getElementById('btn-ed-bulk-paste')?.addEventListener('click', () => {
    const txt = prompt("Cole os itens de inspeção (um por linha):");
    if(txt) {
      const linhas = txt.split('\n').map(l => l.trim()).filter(l => l);
      linhas.forEach(l => state.estruturaEditando.itens.push({ id: uid(), texto: l, categoria: '' }));
      render();
    }
  });

  document.querySelectorAll('.ed-item-txt').forEach(inp => {
    inp.addEventListener('change', (e) => { 
      state.estruturaEditando.itens[e.target.dataset.idx].texto = e.target.value; 
    });
  });
  
  document.querySelectorAll('.ed-item-cat').forEach(inp => {
    inp.addEventListener('change', (e) => { 
      state.estruturaEditando.itens[e.target.dataset.idx].categoria = e.target.value; 
    });
  });

  document.getElementById('btn-save-est')?.addEventListener('click', async () => {
    const est = state.estruturaEditando;
    est.nome = document.getElementById('ed-est-nome').value.trim();
    est.setor = document.getElementById('ed-est-setor').value;
    
    if(!est.nome) {
      return showToast('Nome obrigatório!');
    }
    
    const idx = state.estruturas.findIndex(x => x.id === est.id);
    if(idx >= 0) {
      // Preserva a criação original e carimba a edição.
      est.criadoEm  = state.estruturas[idx].criadoEm || null;
      est.criadoPor = state.estruturas[idx].criadoPor || null;
      est.atualizadoEm  = new Date().toISOString();
      est.atualizadoPor = state.usuarioEmail || null;
      state.estruturas[idx] = est;
    } else {
      est.criadoEm  = new Date().toISOString();
      est.criadoPor = state.usuarioEmail || null;
      state.estruturas.push(est);
    }
    
    await storageSet('estruturas', state.estruturas);
    
    if(_supabase && navigator.onLine) {
      const { error } = await _supabase.from('estruturas').upsert({
        id: est.id,
        nome: est.nome,
        setor: est.setor,
        itens: { setor: est.setor, list: est.itens },
        criado_em: est.criadoEm || null,
        criado_por: est.criadoPor || null,
        atualizado_em: est.atualizadoEm || null,
        atualizado_por: est.atualizadoPor || null
      });
      if(error) {
        console.error('Erro ao salvar no Supabase:', error);
        showToast('Salvo localmente! Aviso: erro de sincro com nuvem.');
      } else {
        showToast('Estrutura salva na Nuvem e localmente!');
      }
    } else {
      showToast('Estrutura salva localmente!');
    }
    
    state.estruturaEditando = null;
    render();
  });
}

window.moverItemEst = function(idx, dir) {
  const arr = state.estruturaEditando.itens;
  if(idx + dir < 0 || idx + dir >= arr.length) return;
  const temp = arr[idx];
  arr[idx] = arr[idx + dir];
  arr[idx + dir] = temp;
  render();
}

window.removerItemEst = function(idx) {
  state.estruturaEditando.itens.splice(idx, 1);
  render();
}

// Inicia um check-list NOVO do zero, descartando qualquer edição/rascunho pendente.
window.novoCheckList = function() {
  const nv = state.novaVistoria;
  const emAndamento = nv && (nv.id || nv.step === 2 || nv.emp || nv.est || nv.resp || (nv.itens && nv.itens.length));
  if (emAndamento) {
    const editando = !!nv.id;
    const msg = editando
      ? 'Existe uma edição em andamento que ainda não foi concluída. Iniciar um NOVO check-list vai descartar essas alterações. Deseja continuar?'
      : 'Existe um check-list em andamento. Iniciar um novo vai descartar o preenchimento atual. Deseja continuar?';
    if (!confirm(msg)) return;
  }
  limparRascunho();
  state.novaVistoria = null;
  setView('nova');
};

// Sai do check-list atual (novo ou edição) sem salvar e volta para a tela apropriada.
window.cancelarCheckList = function() {
  const nv = state.novaVistoria;
  const editando = !!(nv && nv.id);
  const msg = editando
    ? 'Descartar as alterações não salvas e voltar ao histórico? As mudanças feitas nesta edição (ainda não concluídas) serão perdidas.'
    : 'Descartar este novo check-list e voltar? Os dados preenchidos serão perdidos.';
  if (!confirm(msg)) return;
  limparRascunho();
  state.novaVistoria = null;
  setView(editando ? 'vistorias' : 'dashboard');
};

function bindNovaVistoria() {
  const nv = state.novaVistoria;
  
  if (nv && nv.step === 1) {
    document.getElementById('nv-emp')?.addEventListener('change', (e) => {
      nv.emp = e.target.value;
      nv.est = '';
      render();
    });

    document.getElementById('btn-toggle-todas-est')?.addEventListener('click', () => {
      nv.mostrarTodasEstruturas = !nv.mostrarTodasEstruturas;
      render();
    });

    document.getElementById('btn-gps')?.addEventListener('click', () => {
      document.getElementById('gps-status').textContent = 'Buscando satélites...';
      navigator.geolocation.getCurrentPosition(
        pos => {
          nv.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
          document.getElementById('gps-status').textContent = `Lat: ${nv.gps.lat.toFixed(5)}, Lng: ${nv.gps.lng.toFixed(5)}`;
          agendarSalvarRascunho();
        },
        err => { 
          document.getElementById('gps-status').textContent = 'Erro ou permissão negada.'; 
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    document.getElementById('btn-nv-start')?.addEventListener('click', () => {
      if (!nv.id) {
         nv.emp = document.getElementById('nv-emp').value;
         nv.est = document.getElementById('nv-est').value;
      } else {
         // Edição: permite corrigir a estrutura alvo (mantém itens e respostas).
         const estSel = document.getElementById('nv-est');
         if (estSel && estSel.value) nv.est = estSel.value;
      }
      
      nv.equipe = document.getElementById('nv-equipe').value;
      nv.resp = document.getElementById('nv-resp').value;
      
      const dataHoraInput = document.getElementById('nv-data-hora').value;
      
      if (!nv.emp || !nv.est || !nv.equipe || !nv.resp || !dataHoraInput) {
        return showToast('Preencha todos os campos obrigatórios!');
      }
      
      nv.dataHora = new Date(dataHoraInput).toISOString();

      if(nv.itens.length === 0) {
        const estruturaRef = state.estruturas.find(e => e.nome === nv.est);
        nv.itens = estruturaRef ? JSON.parse(JSON.stringify(estruturaRef.itens)) : [];
      }
      
      nv.step = 2;
      render();
      salvarRascunhoAgora();
    });
  }

  if (nv && nv.step === 2) {
    document.getElementById('btn-nv-back')?.addEventListener('click', () => { 
      nv.step = 1; 
      render(); 
      agendarSalvarRascunho();
    });
    
    document.getElementById('btn-nv-add-item')?.addEventListener('click', () => {
      window.abrirAdicionarItemNV();
    });

    document.querySelectorAll('.seg button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.target.dataset.id;
        const st = e.target.dataset.status;
        
        if(!nv.respostas[id]) {
          nv.respostas[id] = { observacao: '', criticidade: 'media', recomendacao: '', fotos: [] };
        }
        
        nv.respostas[id].status = st;
        agendarSalvarRascunho();
        
        const parentCard = e.target.closest('.item-card');
        parentCard.querySelectorAll('.seg button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        const itemExtra = parentCard.querySelector('.item-extra');
        const ncFields = parentCard.querySelector('.nc-fields');
        
        itemExtra.classList.remove('hidden');
        if (st === 'nc') {
          ncFields.classList.remove('hidden');
        } else {
          ncFields.classList.add('hidden');
        }

        setTimeout(() => parentCard.scrollIntoView({behavior: "smooth", block: "center"}), 50);
      });
    });

    document.querySelectorAll('.nv-obs').forEach(inp => {
      inp.addEventListener('input', e => { nv.respostas[e.target.dataset.id].observacao = e.target.value; agendarSalvarRascunho(); });
    });
    
    document.querySelectorAll('.nv-crit').forEach(inp => {
      inp.addEventListener('change', e => { nv.respostas[e.target.dataset.id].criticidade = e.target.value; agendarSalvarRascunho(); });
    });
    
    document.querySelectorAll('.nv-recom').forEach(inp => {
      inp.addEventListener('input', e => { nv.respostas[e.target.dataset.id].recomendacao = e.target.value; agendarSalvarRascunho(); });
    });

    document.getElementById('nv-obs-geral')?.addEventListener('input', e => {
      nv.observacaoGeral = e.target.value;
      agendarSalvarRascunho();
    });

    document.getElementById('btn-nv-save')?.addEventListener('click', async (ev) => {
      // Impede que cliques repetidos (ex.: por achar que travou) criem cópias.
      if (_salvandoVistoria) return;

      const faltam = nv.itens.filter(it => !nv.respostas[it.id]?.status);
      if(faltam.length > 0) {
        return showToast('Responda todos os itens do check-list antes de salvar!');
      }
      
      const ncsSemObs = nv.itens.filter(it => nv.respostas[it.id]?.status === 'nc' && !nv.respostas[it.id]?.observacao.trim());
      if(ncsSemObs.length > 0) {
        return showToast('Toda Não Conformidade exige uma Observação justificando o problema.');
      }

      // Garante que o texto das observações gerais (opcional) seja capturado mesmo sem disparar o evento
      const obsGeralEl = document.getElementById('nv-obs-geral');
      if (obsGeralEl) nv.observacaoGeral = obsGeralEl.value;

      const finalItens = nv.itens.map(it => ({
        ...it,
        status: nv.respostas[it.id].status,
        observacao: nv.respostas[it.id].observacao,
        criticidade: nv.respostas[it.id].status === 'nc' ? nv.respostas[it.id].criticidade : null,
        recomendacao: nv.respostas[it.id].status === 'nc' ? nv.respostas[it.id].recomendacao : null,
        fotos: nv.respostas[it.id].fotos
      }));

      // Gera o id UMA vez e reaproveita em tentativas seguintes (evita duplicar).
      // Em edição, usa o id existente. Assim, salvar de novo ATUALIZA o mesmo
      // registro em vez de criar outro.
      if (!nv.id && !nv._idFinal) nv._idFinal = uid();
      const idFinal = nv.id || nv._idFinal;

      const vistObj = {
        id: idFinal,
        empreendimentoNome: nv.emp,
        estruturaNome: nv.est,
        equipe: nv.equipe,
        responsavel: nv.resp,
        dataHora: nv.dataHora,
        gps: nv.gps,
        itens: finalItens,
        observacaoGeral: nv.observacaoGeral || ''
      };

      // Trava + feedback visual no botão
      _salvandoVistoria = true;
      const btn = ev.currentTarget;
      const textoOriginal = btn.textContent;
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.textContent = '⏳ Salvando...';

      try {
        await saveVistoria(vistObj);
        await limparRascunho();
        state.novaVistoria = null;
        setView('vistorias');
      } catch (err) {
        console.error('Falha ao concluir check-list:', err);
        showToast('Erro ao salvar. Tente novamente.');
        btn.disabled = false;
        btn.style.opacity = '';
        btn.textContent = textoOriginal;
      } finally {
        _salvandoVistoria = false;
      }
    });
  }
}

  if(confirm('Tem certeza que deseja remover este item deste check-list?')) {
    state.novaVistoria.itens = state.novaVistoria.itens.filter(i => i.id !== id);

    render();
    agendarSalvarRascunho();
  }
};

// Sobe (dir = -1) ou desce (dir = 1) um item na ordem do check-list.
// As respostas seguem o item, pois são vinculadas pelo id, não pela posição.
window.moverItemNV = function(id, dir) {
  const nv = state.novaVistoria;
  if(!nv || !Array.isArray(nv.itens)) return;
  const idx = nv.itens.findIndex(it => it.id === id);
  if(idx < 0) return;
  const alvo = idx + dir;
  if(alvo < 0 || alvo >= nv.itens.length) return;
  const tmp = nv.itens[idx];
  nv.itens[idx] = nv.itens[alvo];
  nv.itens[alvo] = tmp;
  render();
  agendarSalvarRascunho();
};

window.addFoto = async function(event, itemId) {
  const files = Array.from(event.target.files || []);
  if(files.length === 0) return;

  if(!state.novaVistoria.respostas[itemId]) {
    state.novaVistoria.respostas[itemId] = { status: '', observacao: '', criticidade: 'media', recomendacao: '', fotos: [] };
  }

  const total = files.length;
  let ok = 0, erros = 0;
  for(let i = 0; i < total; i++) {
    showToast(total > 1 ? `Comprimindo foto ${i+1} de ${total}...` : 'Comprimindo foto...');
    try {
      const base64 = await fileToCompressedDataURL(files[i]);
      state.novaVistoria.respostas[itemId].fotos.push(base64);
      ok++;
    } catch(e) {
      console.error(e);
      erros++;
    }
  }

  // limpa o input para permitir escolher os mesmos arquivos de novo, se precisar
  event.target.value = '';

  render();
  salvarRascunhoAgora();
  setTimeout(() => document.getElementById('photos-'+itemId)?.scrollIntoView({behavior: "smooth", block: "center"}), 100);

  if(erros > 0) showToast(`${ok} foto(s) adicionada(s), ${erros} falharam.`);
  else if(total > 1) showToast(`${ok} fotos adicionadas.`);
}

window.removeFoto = function(itemId, photoIdx) {
  state.novaVistoria.respostas[itemId].fotos.splice(photoIdx, 1);
  render();
  salvarRascunhoAgora();
}
