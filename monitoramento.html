  window.print();
};

/* ============================================================
   MULTI-SELEÇÃO EM CASCATA — componente
   ============================================================ */
// A caixa de marcacao e desenhada em CSS, nao e o checkbox nativo: havia regra
// antiga (.multi-select-dropdown input[type=checkbox]) com especificidade maior
// colapsando a nativa, e appearance:none em checkbox nativo se comporta
// diferente em cada navegador. O input segue existindo, so fica invisivel.
function multiSel(id, label, opcoes, selecionados, contagemTotal) {
  const todos = selecionados.length === 0;
  const nomes = selecionados.map(v => (opcoes.find(o => o.v === v) || {}).t).filter(Boolean);
  const resumo = todos
    ? `Todos (${contagemTotal})`
    : (nomes.length <= 1 ? (nomes[0] || '1 selecionado')
       : `${nomes.length} de ${contagemTotal} selecionados`);

  const opt = (v, t, marcado, forte) => `
    <label class="ms-opt${marcado ? ' on' : ''}">
      <input type="checkbox" data-ms="${id}" value="${esc(v)}" ${marcado ? 'checked' : ''}>
      <span class="ms-box" aria-hidden="true"></span>
      <span class="ms-txt"${forte ? ' style="font-weight:600;"' : ''}>${esc(t)}</span>
    </label>`;

  return `
  <div class="field" style="margin:0;">
    <label class="field-label">${esc(label)}</label>
    <details class="multi-select-details" id="ms-${id}">
      <summary class="multi-select-summary" title="${esc(todos ? 'Todos' : nomes.join(', '))}">
        <span class="ms-resumo">${esc(resumo)}</span>
        ${todos ? '' : `<span class="ms-pill">${selecionados.length}</span>`}
      </summary>
      <div class="multi-select-dropdown">
        ${opt('', `Todos (${contagemTotal})`, todos, true)}
        <div class="ms-sep"></div>
        ${opcoes.map(o => opt(o.v, o.t, selecionados.includes(o.v))).join('')}
        ${!opcoes.length ? '<div class="ms-vazio">Nenhuma opção disponível nesta seleção.</div>' : ''}
      </div>
    </details>
  </div>`;
}

function bindMultiSel(id, onChange) {
  const det = document.getElementById('ms-' + id);
  if (det) det.addEventListener('toggle', () => {
    if (!det.open) return;
    document.querySelectorAll('details.multi-select-details').forEach(o => { if (o !== det) o.open = false; });
  });
  document.querySelectorAll(`input[data-ms="${id}"]`).forEach(cb => {
    cb.onchange = () => {
      const marcados = Array.from(document.querySelectorAll(`input[data-ms="${id}"]`));
      if (cb.value === '') {
        marcados.forEach(x => { if (x.value !== '') x.checked = false; });
        onChange([]);
        return;
      }
      const todosCb = marcados.find(x => x.value === '');
      if (todosCb) todosCb.checked = false;
      onChange(marcados.filter(x => x.value !== '' && x.checked).map(x => x.value));
    };
  });
}

/* ============================================================
   FILTRO EM CASCATA — resolve empreendimento -> ponto -> parâmetro
   ============================================================ */
// A matriz é o discriminador de topo: define unidade, lógica de avaliação
// (binária no ar, em faixas no solo) e qual norma se aplica. Misturar matrizes
// num mesmo gráfico ou tabela só faz sentido em percentual do limite.
const MATRIZES = {
  ar_imissao:       { curto: 'Ar — imissão',        longo: 'Qualidade do ar (imissão)',            norma: 'CONAMA 491/2018 e 506/2024' },
  ar_fonte_fixa:    { curto: 'Ar — fonte fixa',     longo: 'Emissões atmosféricas de fonte fixa',  norma: 'CONAMA 382/2006 e 436/2011' },
  agua_superficial: { curto: 'Água superficial',    longo: 'Água superficial',                      norma: 'CONAMA 357/2005' },
  agua_subterranea: { curto: 'Água subterrânea',    longo: 'Água subterrânea',                      norma: 'CONAMA 396/2008' },
  efluente:         { curto: 'Efluente',            longo: 'Efluente líquido',                      norma: 'CONAMA 430/2011' },
  solo:             { curto: 'Solo',                longo: 'Solo',                                  norma: 'CONAMA 420/2009 e VRQ estadual' },
  ruido:            { curto: 'Ruído',               longo: 'Ruído ambiental',                       norma: 'NBR 10151' },
  sismografia:      { curto: 'Sismografia',         longo: 'Vibração e sobrepressão acústica',      norma: 'NBR 9653' }
};
function rotuloMatriz(m, longo) {
  const x = MATRIZES[m];
  return x ? (longo ? x.longo : x.curto) : (m || '—');
}
function badgeMatriz(m) {
  return `<span class="badge na" style="white-space:nowrap;" title="${esc(rotuloMatriz(m, true))}${MATRIZES[m] ? ' · base legal típica: ' + esc(MATRIZES[m].norma) : ''}">${esc(rotuloMatriz(m))}</span>`;
}

function rotuloCampanha(c) {
  const ini = fmtData(c.data_inicio);
  const fim = c.data_fim && c.data_fim !== c.data_inicio ? ' a ' + fmtData(c.data_fim) : '';
  return ini + fim;
}

function matrizesExistentes() {
  return [...new Set(state.pontos.map(p => p.matriz))].sort();
}

function cascata(f) {
  // A matriz ativa é contexto de trabalho, não filtro de tela: ela define
  // unidade, lógica de avaliação e norma aplicável. Cada matriz é um
  // monitoramento diferente, e misturá-los num painel só gera confusão.
  const mats = matrizesExistentes();
  const matIds = state.matriz ? [state.matriz] : mats;

  const emps = state.empreendimentos.filter(e =>
    state.pontos.some(p => p.empreendimento_id === e.id && matIds.includes(p.matriz)));
  const empIds = f.emps.length ? f.emps.filter(id => emps.some(e => e.id === id)) : emps.map(e => e.id);

  // Campanha = um laudo = uma data de coleta. É o filtro temporal natural aqui:
  // a data da coleta já identifica a campanha, então não faz sentido pedir
  // intervalo para o usuário digitar.
  const camps = state.campanhas
    .filter(c => empIds.includes(c.empreendimento_id))
    .slice().sort((a, b) => String(b.data_inicio).localeCompare(String(a.data_inicio)));
  const campIds = f.camps.length ? f.camps.filter(id => camps.some(c => c.id === id)) : camps.map(c => c.id);

  const pontos = state.pontos.filter(p => empIds.includes(p.empreendimento_id) && matIds.includes(p.matriz));
  const pontoIds = f.pontos.length ? f.pontos.filter(id => pontos.some(p => p.id === id)) : pontos.map(p => p.id);

  const matrizes = [...new Set(pontos.filter(p => pontoIds.includes(p.id)).map(p => p.matriz))];
  const params = state.parametros.filter(p => !matrizes.length || matrizes.includes(p.matriz));
  const paramIds = f.params.length ? f.params.filter(id => params.some(p => p.id === id)) : params.map(p => p.id);

  return { mats, matIds, emps, empIds, camps, campIds, pontos, pontoIds, params, paramIds };
}

async function linhasFiltradas(f) {
  const c = cascata(f);
  const { data, error } = await _supabase.from('mon_resultados_avaliados').select('*');
  if (error) { showToast('Erro ao ler avaliação: ' + error.message); return { rows: [], c }; }
  const rows = (data || []).filter(r =>
    c.campIds.includes(r.campanha_id) &&
    c.pontoIds.includes(r.ponto_id) &&
    c.paramIds.includes(r.parametro_id) &&
    r.tipo_amostra === 'ambiental'
  );
  return { rows, c };
}

function caixaProcedencia(padroes) {
  const porFonte = {};
  padroes.forEach(x => { const k = x.fonte_tipo || 'nao_registrada'; porFonte[k] = (porFonte[k] || 0) + 1; });
  const rot = {
    dou: 'Diário Oficial da União — fonte primária',
    orgao: 'Publicação do órgão ambiental competente — fonte primária',
    reproducao: 'Reprodução em documento secundário — não serve de base legal',
    nao_registrada: 'Origem não registrada'
  };
  return `
  <details class="prov-box">
    <summary>O que significa "não conferido" — e por que a resolução estar cadastrada não basta</summary>
    <div class="body">
      <p><strong>"Conferido" não quer dizer que o valor está no banco.</strong> Todos os 
      ${padroes.length} padrões estão cadastrados e todos são usados na avaliação. O campo
      responde outra pergunta: <em>alguém com responsabilidade técnica comparou este número
      com o texto oficial da norma?</em></p>

      <p>A distinção existe porque a biblioteca é <strong>compartilhada por todos os clientes</strong>.
      Um número errado aqui não erra um laudo — erra todas as avaliações de todos os
      empreendimentos, para trás e para frente no tempo. Já aconteceu duas vezes neste projeto:
      valores semeados a partir do Anexo I reproduzido em laudo da Bioar. Os valores até
      coincidiam, mas a base da conferência não valia, e um deles não coincidia — a primeira
      faixa do IQAr, que o laudo dava como MP10 0–50 e MP2,5 0–25 quando o Anexo II oficial
      manda usar o padrão final como teto (45 e 15).</p>

      <p>Laudo, memorial e repositório de terceiro reproduzem a norma; não <em>são</em> a norma.
      Reprodução tem erro de digitação, versão desatualizada e recorte parcial — e quem assina o
      relatório com CREA responde pelo valor, não o laboratório que o copiou.</p>

      <p><strong>Procedência registrada hoje:</strong></p>
      <table>
        ${Object.entries(porFonte).map(([k, v]) => `<tr>
          <td style="white-space:nowrap;"><strong>${v}</strong></td>
          <td>${esc(rot[k] || k)}</td></tr>`).join('')}
      </table>

      <p style="margin-top:10px;">Conferir não é só marcar um visto. O registro precisa dizer
      <strong>qual fonte</strong> foi consultada, <strong>quem</strong> conferiu e <strong>quando</strong> —
      é isso que torna a afirmação auditável, em vez de indistinguível de um clique errado.</p>

      <p><strong>Avaliável e Procedência não são a mesma coisa.</strong> Avaliável responde
      <em>este padrão entra no cálculo de conformidade?</em> — fica em Não quando a etapa nunca foi ativada
      pela norma, ou quando o período é anual e quatro dias de coleta por ano não produzem média anual.
      Procedência responde <em>de onde veio o número e quem validou?</em> São independentes, e a combinação
      mais perigosa é Avaliável = Sim com procedência não conferida: o padrão já está julgando conformidade
      sem ter sido validado.</p>
    </div>
  </details>`;
}

/* ============================================================
   PAINEL GERAL
   ============================================================ */
const GLOSSARIO = `
  <details class="prov-box" style="border-left-color:var(--linha-neutra, #C3CCD8);">
    <summary>Glossário — seis palavras que sustentam o sistema</summary>
    <div class="body">
      <table>
        <tr><td style="white-space:nowrap;padding-right:14px;"><strong>Monitoramento</strong></td>
            <td>O tipo de meio ambiental medido: qualidade do ar, água superficial, solo, ruído. É o
            seletor no topo da lateral e governa todas as abas: define unidade, lógica de avaliação e

        <tr><td style="padding-right:14px;"><strong>Campanha</strong></td>
            <td>Um laudo entregue pelo laboratório. Uma campanha, um laudo, um período de coleta.</td></tr>
        <tr><td style="padding-right:14px;"><strong>Ponto</strong></td>
            <td>Um local de amostragem, identificado por um código estável entre campanhas. O código é a
            identidade: se o laudo escrever "PONTO 01" num ano e "P01" no outro, a série se parte em duas.</td></tr>
        <tr><td style="padding-right:14px;"><strong>Parâmetro</strong></td>

      </table>
      <p style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;">
      <strong>A regra que explica o resto:</strong> conformidade nunca é gravada. Cada vez que você abre
      uma tela, cada resultado é comparado ao padrão vigente <em>na data da própria coleta</em>. Por isso
      um laudo de 2021 é julgado pela norma de 2021, e por isso cadastrar uma norma nova reescreve o

  </details>`;

function viewPainel() {
  const f = state.painel;
  const c = cascata(f);

  return `
  <div class="view-head">
    <div>
      <div class="eyebrow" id="eyebrow-painel"></div>
      <h1 class="view-title">Painel geral</h1>
      <p class="view-sub">Conformidade calculada contra a norma vigente na data de cada coleta. Nada aqui é gravado — é releitura.</p>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">${c.matIds.map(m => badgeMatriz(m)).join('')}</div>
    </div>

  <div class="filter-bar">

    ${multiSel('p-ponto', 'Pontos', c.pontos.map(p => ({ v: p.id, t: p.codigo + ' — ' + (p.nome || p.matriz) })), f.pontos, c.pontos.length)}
    ${multiSel('p-par', 'Parâmetros', c.params.map(p => ({ v: p.id, t: p.sigla + ' (' + p.unidade + ')' })), f.params, c.params.length)}
  </div>

  <div class="grid cols-4" id="painel-kpis" style="margin-bottom:22px;">
    ${[1,2,3,4].map(() => `<div class="card kpi"><div class="skel" style="width:40%;margin:6px 0 12px;"></div><div class="skel" style="width:80%;"></div></div>`).join('')}
  </div>

  <div id="painel-piores" style="margin-bottom:18px;"></div>

  <div class="card card-pad" style="margin-bottom:18px;">
    <div class="eyebrow" style="margin-bottom:10px;">Resumo por campanha</div>
    <div id="painel-campanhas"></div>
  </div>

  <div class="card card-pad" style="margin-bottom:18px;">
    <div class="eyebrow" style="margin-bottom:10px;">Base legal aplicada nesta seleção</div>
    <div id="painel-normas"></div>

  <div class="card" id="painel-tabela-wrap"></div>

  <p id="painel-rodape" style="font-size:11.5px;color:var(--ink-faint);margin:14px 0 0;text-align:center;"></p>`;

async function bindPainel() {
  bindMultiSel('p-emp', v => { state.painel.emps = v; state.painel.camps = []; state.painel.pontos = []; state.painel.params = []; render(); });
  bindMultiSel('p-camp', v => { state.painel.camps = v; render(); });
  bindMultiSel('p-ponto', v => { state.painel.pontos = v; render(); });
  bindMultiSel('p-par', v => { state.painel.params = v; render(); });

  const tw = document.getElementById('painel-tabela-wrap');
  if (tw) tw.innerHTML = '<div class="card-pad"><div class="loading-row">Lendo a avaliação de conformidade…</div></div>';

  const { rows } = await linhasFiltradas(state.painel);
  state.ultimasLinhas = rows;

  const conf = rows.filter(r => r.situacao === 'conforme').length;
  const exc = rows.filter(r => r.situacao === 'excedente').length;
  const inc = rows.filter(r => r.situacao === 'inconsistente').length;
  const sp = rows.filter(r => r.situacao === 'sem_padrao').length;
  const naoAvaliados = inc + sp;
  const naoConferido = rows.filter(r => r.padrao_conferido === false).length;

  const validos = rows.filter(r => r.status_dado === 'ok' && r.percentual_do_limite !== null);
  const maior = validos.length ? Math.max(...validos.map(r => Number(r.percentual_do_limite))) : null;

  document.getElementById('painel-kpis').innerHTML = `
    <div class="card kpi"><div class="num">${rows.length}</div><div class="lbl">Resultados na seleção</div></div>
    <div class="card kpi"><div class="num" style="${exc ? 'color:var(--nc);' : ''}">${exc}</div><div class="lbl">Excedências</div></div>
    <div class="card kpi"><div class="num" style="${naoAvaliados ? 'color:var(--media);' : ''}">${naoAvaliados}</div><div class="lbl">Sem conclusão possível</div></div>
    <div class="card kpi"><div class="num">${maior === null ? '—' : num(maior, 1) + '%'}</div><div class="lbl">Maior razão valor/limite</div></div>`;

  const editados = rows.filter(r => r.editado).length;
  const divergentes = rows.filter(r => r.valor_divergente_do_laudo).length;

  const alertas = [];
  const matsSel = [...new Set(rows.map(r => r.matriz))];
  if (matsSel.length > 1) alertas.push(`<div class="diag aviso" style="margin-bottom:12px;">
    <div class="diag-t">A seleção mistura ${matsSel.length} matrizes: ${matsSel.map(m => esc(rotuloMatriz(m))).join(', ')}</div>
    <div class="diag-d">Só o percentual do limite é comparável entre matrizes — concentração não é,
    porque as unidades e a lógica de avaliação diferem (binária no ar, em faixas no solo e na água
    subterrânea). Para relatório de cliente, prefira uma matriz por documento.</div></div>`);
  if (naoAvaliados) alertas.push(`<div class="diag aviso" style="margin-bottom:12px;">
    <div class="diag-t">${naoAvaliados} de ${rows.length} resultados sem conclusão possível</div>
    <div class="diag-d">${inc} com dado inconsistente e ${sp} sem padrão legal vigente na data.
    Isso é <strong>abstenção, não aprovação</strong>: os ${conf} conformes não cobrem esses casos.
    Não apresente esta seleção como comprovação de conformidade sem resolver as pendências.</div></div>`);
  if (divergentes) alertas.push(`<div class="diag aviso" style="margin-bottom:12px;">
    <div class="diag-t">${divergentes} resultado(s) com valor diferente do laudo</div>
    <div class="diag-d">Foram editados manualmente e o valor atual não é o que o laboratório
    reportou. O valor original está preservado e aparece embaixo de cada linha.
    Todo relatório gerado desta seleção declara isso.</div></div>`);
  else if (editados) alertas.push(`<div class="diag" style="margin-bottom:12px;">
    <div class="diag-t">${editados} resultado(s) editado(s) manualmente</div>
    <div class="diag-d">Sem alteração de valor — as edições mexeram em metadado
    (data, método, status ou atribuição de ponto/parâmetro).</div></div>`);
  if (naoConferido) alertas.push(`<div class="diag aviso" style="margin-bottom:12px;">
    <div class="diag-t">${naoConferido} resultados avaliados contra padrão não conferido em fonte primária</div>
    <div class="diag-d">A base legal correspondente está com <span class="mono">conferido = false</span>.
    Confira o texto no Diário Oficial antes de usar em ofício, relatório de cliente ou fiscalização.</div></div>`);
  document.getElementById('painel-alerta').innerHTML = alertas.join('');

  const normas = {};
  rows.forEach(r => {
    if (!r.limite_base_legal) return;
    const k = r.limite_base_legal + (r.limite_contexto ? ' · ' + r.limite_contexto : '');
    normas[k] = normas[k] || { n: 0, conferido: r.padrao_conferido, anos: new Set() };
    normas[k].n++;
    normas[k].anos.add(String(r.inicio || r.campanha_inicio).slice(0, 4));
  });
  const nEntries = Object.entries(normas);
  document.getElementById('painel-normas').innerHTML = !nEntries.length
    ? '<p style="font-size:13px;color:var(--ink-faint);margin:0;">Nenhum padrão legal aplicável nesta seleção.</p>'
    : nEntries.map(([k, v]) => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);">
        <span style="flex:1;font-size:13px;">${esc(k)}
          <span style="color:var(--ink-faint);font-size:11.5px;"> · ${[...v.anos].sort().join(', ')}</span></span>
        <span class="mono" style="font-size:12px;color:var(--ink-faint);">${v.n} result.</span>
        ${v.conferido ? '<span class="badge conforme">Conferido</span>' : '<span class="badge pending">Não conferido</span>'}
      </div>`).join('');


  // Pior caso por parâmetro — critério determinístico (maior razão valor/limite),
  // nunca escolhido por IA.
  const porPar = {};
  validos.forEach(r => {
    const k = r.parametro;
    if (!porPar[k] || Number(r.percentual_do_limite) > Number(porPar[k].percentual_do_limite)) porPar[k] = r;
  });
  document.getElementById('painel-piores').innerHTML = !Object.keys(porPar).length ? '' : `
    <div class="grid cols-3">
      ${Object.entries(porPar).map(([par, r]) => {
        const pct = Number(r.percentual_do_limite);
        const cor = r.situacao === 'excedente' ? 'var(--nc)' : (pct > 80 ? 'var(--media)' : 'var(--conforme)');
        return `<div class="card card-pad">
          <div class="eyebrow" style="margin-bottom:6px;">${esc(par)} — pior caso</div>
          <div style="font-size:26px;font-weight:600;color:${cor};line-height:1.1;">${num(pct, 1)}%</div>
          <div style="font-size:12px;color:var(--ink-faint);margin-top:4px;">
            ${num(r.valor, 2)} de ${num(r.limite, 2)} ${esc(r.unidade || '')}<br>
            ${esc(r.ponto_codigo || '')} · ${fmtData(String(r.inicio || r.campanha_inicio).slice(0, 10))}<br>
            ${esc(r.limite_base_legal || '')}${r.limite_contexto ? ' · ' + esc(r.limite_contexto) : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;

  // Resumo por campanha
  const porCamp = {};
  rows.forEach(r => {
    const k = String(r.campanha_inicio);
    porCamp[k] = porCamp[k] || { conf: 0, exc: 0, inc: 0, sp: 0, naoConf: 0, n: 0, pior: null };
    const g = porCamp[k];
    g.n++;
    if (r.situacao === 'conforme') g.conf++;
    else if (r.situacao === 'excedente') g.exc++;
    else if (r.situacao === 'inconsistente') g.inc++;
    else if (r.situacao === 'sem_padrao') g.sp++;
    if (r.limite_base_legal && r.padrao_conferido === false) g.naoConf++;
    if (r.status_dado === 'ok' && r.percentual_do_limite !== null &&
        (!g.pior || Number(r.percentual_do_limite) > Number(g.pior.percentual_do_limite))) g.pior = r;
  });
  document.getElementById('painel-campanhas').innerHTML = !Object.keys(porCamp).length
    ? '<p style="font-size:13px;color:var(--ink-faint);margin:0;">Nenhuma campanha nesta seleção.</p>'
    : `<div class="table-wrapper"><table>
        <thead><tr><th>Campanha</th><th>Result.</th><th>Conf.</th><th>Exced.</th>
        <th>Sem conclusão</th><th>Pior razão</th><th>Fonte legal</th></tr></thead>
        <tbody>${Object.keys(porCamp).sort().map(k => {
          const g = porCamp[k];
          const semConc = g.inc + g.sp;
          return `<tr>
            <td><strong>${fmtData(k)}</strong></td>
            <td class="mono">${g.n}</td>
            <td class="mono">${g.conf}</td>
            <td class="mono" style="${g.exc ? 'color:var(--nc);font-weight:600;' : ''}">${g.exc}</td>
            <td class="mono" style="${semConc ? 'color:var(--media);font-weight:600;' : ''}">${semConc}</td>
            <td>${g.pior ? barraPercentual(g.pior.percentual_do_limite, g.pior.situacao) : '—'}</td>
            <td>${g.naoConf ? '<span class="badge pending">Não conferida</span>' : (g.n - g.inc - g.sp > 0 ? '<span class="badge conforme">Conferida</span>' : '—')}</td>
          </tr>`;
        }).join('')}</tbody></table></div>`;

  const un = modo === 'pct' ? '% do limite legal' : ([...new Set(validos.map(r => r.unidade))][0] || '');
  renderChart('cv-serie', () => ({
    type: 'line',
    data: { labels: anos, datasets: dsets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {

        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + Number(c.parsed.y).toFixed(2) + (modo === 'pct' ? '%' : ' ' + un) } }
      },

    },
    plugins: modo === 'pct' ? [{
      id: 'l100',
      afterDatasetsDraw(ch) {
        const y = ch.scales.y.getPixelForValue(100), a = ch.chartArea, x = ch.ctx;
        if (y < a.top || y > a.bottom) return;
        x.save(); x.strokeStyle = '#d03b3b'; x.lineWidth = 2; x.setLineDash([6, 4]);
        x.beginPath(); x.moveTo(a.left, y); x.lineTo(a.right, y); x.stroke();
        x.fillStyle = '#d03b3b'; x.font = '11px sans-serif'; x.fillText('limite legal', a.left + 4, y - 4);
        x.restore();

    ? `<p style="font-size:12px;color:var(--ink-faint);margin:0;">
        Em percentual, a mudança de norma fica visível: o mesmo valor sobe de patamar quando o limite cai.
        Pontos amostrados em dias diferentes não são comparáveis entre si — cada linha vale como evolução dela mesma.</p>`

/* ============================================================
   CÓDIGO DO PONTO — normalização
   ------------------------------------------------------------
   O código é a identidade do ponto: a importação casa por ele. Os laudos da
   Bioar escrevem o mesmo ponto físico como "1º Ponto", "Ponto 01", "PONTO 01",
   "01" e "P01" em anos e seções diferentes — foi assim que 4 pontos da Goiascal
   viraram 12 registros e a série histórica se partiu em três.
   A normalização é deliberadamente CONSERVADORA: só reescreve o que reconhece
   como ponto genérico numerado. Códigos com prefixo próprio (PM-01 de poço de
   monitoramento, SS-03 de sondagem de solo, MTZ de montante) são preservados,
   porque ali o prefixo é informação, não ruído.
   ============================================================ */
function normalizarCodigoPonto(bruto) {
  const s0 = String(bruto == null ? '' : bruto).trim().replace(/\s+/g, ' ');
  if (!s0) return { codigo: '', original: s0, mudou: false };

  // "P01" · "P 1" · "01" · "1" · "Ponto 01" · "PONTO 1" · "ponto1"
  let m = s0.match(/^(?:p(?:onto)?\s*[-–.]?\s*)?(\d{1,3})\s*[ºo°]?$/i);
  // "1º Ponto" · "2o ponto" · "3 PONTO"
  if (!m) m = s0.match(/^(\d{1,3})\s*[ºo°]?\s*p(?:onto)?$/i);

  if (m) {
    const cod = 'P' + String(parseInt(m[1], 10)).padStart(2, '0');
    return { codigo: cod, original: s0, mudou: cod !== s0 };
  }
  // Não reconhecido: mantém como está. Não inventa padrão sobre o que não entende.
  return { codigo: s0, original: s0, mudou: false };
}

// Casamento tolerante: compara pela forma normalizada, sem diferenciar caixa.
function mesmoPonto(a, b) {
  return normalizarCodigoPonto(a).codigo.toUpperCase()
       === normalizarCodigoPonto(b).codigo.toUpperCase();
}

/* ============================================================
   COORDENADAS — conversão nos dois sentidos
   ============================================================ */
function latLonParaUtm(lat, lon) {
  if (lat === null || lon === null || lat === '' || lon === '') return null;
  lat = Number(lat); lon = Number(lon);
  if (isNaN(lat) || isNaN(lon)) return null;
  const a = 6378137.0, f = 1 / 298.257223563, e2 = 2 * f - f * f, k0 = 0.9996;
  const fuso = Math.floor((lon + 180) / 6) + 1, lon0 = (fuso - 1) * 6 - 180 + 3;
  const phi = lat * Math.PI / 180, lam = lon * Math.PI / 180, lam0 = lon0 * Math.PI / 180;
  const ep2 = e2 / (1 - e2);
  const N = a / Math.sqrt(1 - e2 * Math.pow(Math.sin(phi), 2));
  const T = Math.pow(Math.tan(phi), 2), C = ep2 * Math.pow(Math.cos(phi), 2);
  const A = (lam - lam0) * Math.cos(phi);
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256) * phi
    - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * phi)
    + (15 * e2 * e2 / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * phi)
    - (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * phi));
  const E = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6
    + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
  let Nn = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24
    + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
  if (lat < 0) Nn += 10000000;
  const bandas = 'CDEFGHJKLMNPQRSTUVWX';
  return { zona: fuso + (bandas[Math.floor((lat + 80) / 8)] || ''), e: Math.round(E), n: Math.round(Nn) };
}

/* ============================================================
   MAPA — camadas de satélite e ruas
   ============================================================ */
// Não uso tiles do Google Satellite: a licença exige chave de API e a
// raspagem direta viola os termos. Esri World Imagery é gratuita com
// atribuição e tem resolução equivalente em área rural.
function criarMapa(elId, centro, zoom) {
  const sat = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Imagens: Esri, Maxar, Earthstar Geographics' });
  const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
  const m = L.map(elId, { layers: [sat], scrollWheelZoom: true })
    .setView(centro || [-15.78, -47.93], zoom || 15);
  L.control.layers({ 'Satélite': sat, 'Ruas': ruas }, {}, { position: 'topright' }).addTo(m);
  L.control.scale({ imperial: false }).addTo(m);
  setTimeout(() => m.invalidateSize(), 60);
  return m;
}

function corSituacao(sit) {
  return sit === 'excedente' ? '#d03b3b'
    : sit === 'conforme' ? '#1baf7a'
    : sit === 'inconsistente' ? '#eda100' : '#888780';
}

async function bindMapa() {
  bindMultiSel('m-emp', v => { state.mapa.emps = v; state.mapa.camps = []; state.mapa.params = []; render(); });
  bindMultiSel('m-camp', v => { state.mapa.camps = v; render(); });
  bindMultiSel('m-par', v => { state.mapa.params = v; render(); });

  if (state.map) { state.map.remove(); state.map = null; }
  const { rows, c } = await linhasFiltradas(state.mapa);
  state.ultimasLinhas = rows;

  const pts = c.pontos.filter(p => p.latitude !== null && p.longitude !== null);
  if (!pts.length) {
    document.getElementById('mapa-box').innerHTML =
      '<div class="empty" style="padding:60px 20px;"><div class="ic">📍</div><p>Nenhum ponto com coordenada nesta seleção.</p></div>';
    return;
  }

  const centro = [
    pts.reduce((s, p) => s + Number(p.latitude), 0) / pts.length,
    pts.reduce((s, p) => s + Number(p.longitude), 0) / pts.length
  ];
  const m = criarMapa('mapa-box', centro, 16);
  state.map = m;

  const grupo = L.featureGroup().addTo(m);
  pts.forEach(p => {
    const meus = rows.filter(r => r.ponto_id === p.id);
    const validos = meus.filter(r => r.status_dado === 'ok' && r.percentual_do_limite !== null);
    const pior = validos.sort((a, b) => Number(b.percentual_do_limite) - Number(a.percentual_do_limite))[0];
    const sit = pior ? pior.situacao : (meus.length ? 'inconsistente' : null);
    const cor = corSituacao(sit);

    L.circleMarker([Number(p.latitude), Number(p.longitude)], {
      radius: 10, color: '#fff', weight: 2, fillColor: cor, fillOpacity: 0.9
    }).addTo(grupo).bindPopup(`
      <div style="font-size:13px;line-height:1.6;min-width:210px;">
        <strong>${esc(p.codigo)}</strong> — ${esc(p.nome || '')}<br>
        <span style="color:#666;">${esc(rotuloMatriz(p.matriz, true))}${p.tipo ? ' · ' + esc(p.tipo) : ''}</span><br>

          ${Number(p.latitude).toFixed(6)}, ${Number(p.longitude).toFixed(6)}<br>
          ${p.utm_e ? esc(p.utm_zona || '') + ' ' + num(p.utm_e, 0) + ' / ' + num(p.utm_n, 0) : 'sem UTM'}
        </span>
        <hr style="border:0;border-top:1px solid #ddd;margin:7px 0;">
        ${pior ? `<strong>Pior caso:</strong> ${esc(pior.parametro)}${pior.editado ? ' <em style="font-size:11px;">(editado)</em>' : ''}<br>
          ${num(pior.valor, 2)} de ${num(pior.limite, 2)} ${esc(pior.unidade || '')}
          — <strong style="color:${cor};">${num(pior.percentual_do_limite, 1)}% do limite</strong><br>
          <span style="font-size:11px;color:#666;">${esc(pior.limite_base_legal || '')}${pior.limite_contexto ? ' · ' + esc(pior.limite_contexto) : ''}<br>
          coleta ${fmtData(String(pior.inicio || pior.campanha_inicio).slice(0, 10))}</span>
          ${pior.padrao_conferido === false ? '<br><span style="font-size:11px;color:#a35;">fonte legal não conferida</span>' : ''}`
        : `<span style="color:#a35;">Sem resultado avaliável nesta seleção.</span>`}
        <hr style="border:0;border-top:1px solid #ddd;margin:7px 0;">
        <a href="#" onclick="event.preventDefault();editarPonto('${esc(p.id)}')">Editar ponto</a>
      </div>`);
  });
  if (pts.length > 1) m.fitBounds(grupo.getBounds().pad(0.25));
}

window.exportarKml = function () {
  const c = cascata(state.mapa);
  const pts = c.pontos.filter(p => p.latitude !== null && p.longitude !== null);
  if (!pts.length) return showToast('Nenhum ponto com coordenada para exportar.');
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>MapaBase — pontos de monitoramento</name>
${pts.map(p => `<Placemark>
  <name>${esc(p.codigo)}${p.nome ? ' - ' + esc(p.nome) : ''}</name>
  <description>${esc(nomeEmp(p.empreendimento_id))} | matriz ${esc(p.matriz)}${p.tipo ? ' | ' + esc(p.tipo) : ''}${p.utm_e ? ' | UTM ' + esc(p.utm_zona || '') + ' ' + p.utm_e + '/' + p.utm_n : ''}</description>
  <Point><coordinates>${Number(p.longitude)},${Number(p.latitude)},0</coordinates></Point>
</Placemark>`).join('\n')}
</Document></kml>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' }));
  a.download = `mapabase-pontos-${new Date().toISOString().slice(0, 10)}.kml`;
  a.click();
  showToast('KML exportado. Abra no Google Earth.');
};

          que é compactado e não é lido aqui).</div>
        </div>
        <div class="field">
          <label class="field-label">Arquivo .kml</label>
          <input type="file" id="kml-file" accept=".kml,application/vnd.google-earth.kml+xml">
        </div>
        <div id="kml-preview"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
        <button class="btn primary" id="kml-aplicar" style="display:none;">Aplicar coordenadas</button>
      </div>
    </div>
  </div>`;

  document.getElementById('kml-file').onchange = ev => {
    const arq = ev.target.files[0];
    if (!arq) return;
    const fr = new FileReader();
    fr.onload = () => {
      let doc;
      try { doc = new DOMParser().parseFromString(fr.result, 'text/xml'); }
      catch (e) { return showToast('Arquivo não pôde ser lido como XML.'); }
      if (doc.querySelector('parsererror')) return showToast('KML inválido.');

      const achados = [];
      doc.querySelectorAll('Placemark').forEach(pm => {
        const coord = pm.querySelector('Point > coordinates');
        if (!coord) return;
        const partes = coord.textContent.trim().split(/[,\s]+/);
        const lon = Number(partes[0]), lat = Number(partes[1]);
        if (isNaN(lat) || isNaN(lon)) return;
        const nome = (pm.querySelector('name') || {}).textContent || '(sem nome)';
        achados.push({ nome: nome.trim(), lat, lon });
      });

      if (!achados.length) {
        document.getElementById('kml-preview').innerHTML =
          '<p style="font-size:13px;color:var(--nc);">Nenhum marcador de ponto encontrado. Linhas e polígonos não são importados.</p>';
        return;
      }
      state.kmlAchados = achados;

      // Casamento sugerido por código no início do nome, mas nunca aplicado
      // automaticamente: coordenada errada num ponto contamina toda a série.
      document.getElementById('kml-preview').innerHTML = `
        <p style="font-size:13px;margin:14px 0 8px;"><strong>${achados.length}</strong> marcador(es) encontrado(s).
        Escolha a qual ponto cadastrado cada um corresponde. O que ficar em "ignorar" não é alterado.</p>
        <div class="table-wrapper"><table>
          <thead><tr><th>Nome no KML</th><th>Coordenada</th><th>Aplicar em</th></tr></thead>
          <tbody>${achados.map((x, i) => {
            const sug = c.pontos.find(p =>
              x.nome.toUpperCase().replace(/\s+/g, '').startsWith(String(p.codigo).toUpperCase().replace(/\s+/g, '')));
            return `<tr>
              <td>${esc(x.nome)}</td>
              <td class="mono" style="font-size:11px;">${x.lat.toFixed(6)}<br>${x.lon.toFixed(6)}</td>
              <td><select id="kml-alvo-${i}">
                <option value="">— ignorar —</option>
                ${c.pontos.map(p => `<option value="${esc(p.id)}" ${sug && sug.id === p.id ? 'selected' : ''}>${esc(p.codigo)} — ${esc(p.nome || p.matriz)}</option>`).join('')}
              </select></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <p style="font-size:12px;color:var(--ink-faint);margin-top:10px;">
          A UTM cadastrada <strong>não</strong> é sobrescrita: ela é o que o laudo declarou e vale como
          rastreabilidade. Só lat/long é atualizado.</p>`;
      document.getElementById('kml-aplicar').style.display = '';
    };
    fr.readAsText(arq);
  };

  document.getElementById('kml-aplicar').onclick = async () => {
    const achados = state.kmlAchados || [];
    let n = 0;
    for (let i = 0; i < achados.length; i++) {
      const alvo = document.getElementById('kml-alvo-' + i);
      if (!alvo || !alvo.value) continue;
      const { error } = await _supabase.from('mon_pontos')
        .update({ latitude: achados[i].lat, longitude: achados[i].lon })
        .eq('id', alvo.value);
      if (error) return showToast('Erro ao salvar: ' + error.message);
      n++;
    }
    fecharModal();
    showToast(n ? `${n} ponto(s) atualizado(s).` : 'Nada foi alterado.');
    if (n) await carregarTudo();
  };
};

/* ============================================================
   PONTOS — com edição de coordenada
   ============================================================ */
function utmParaLatLon(zona, e, n) {
  const m = String(zona || '').match(/^(\d{1,2})\s*([A-Za-z])?$/);
  if (!m || !e || !n) return null;
  const fuso = parseInt(m[1], 10);
  const letra = (m[2] || 'K').toUpperCase();
  const sul = letra < 'N';
  const a = 6378137.0, f = 1 / 298.257223563;
  const e2 = 2 * f - f * f, e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const x = Number(e) - 500000.0;
  let y = Number(n); if (sul) y -= 10000000.0;
  const k0 = 0.9996, M = y / k0;
  const mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256));
  const p1 = mu + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu)
    + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu)
    + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu);
  const ep2 = e2 / (1 - e2);
  const C1 = ep2 * Math.pow(Math.cos(p1), 2);
  const T1 = Math.pow(Math.tan(p1), 2);
  const N1 = a / Math.sqrt(1 - e2 * Math.pow(Math.sin(p1), 2));
  const R1 = a * (1 - e2) / Math.pow(1 - e2 * Math.pow(Math.sin(p1), 2), 1.5);
  const D = x / (N1 * k0);
  const lat = p1 - (N1 * Math.tan(p1) / R1) * (D * D / 2
    - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4) / 24
    + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6) / 720);
  const lon = (D - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
    + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5) / 120) / Math.cos(p1);
  const lon0 = (fuso - 1) * 6 - 180 + 3;
  return { lat: lat * 180 / Math.PI, lon: lon0 + lon * 180 / Math.PI };
}

  <div class="diag" style="margin-bottom:18px;">
    <div class="diag-t">Padrão de coordenada: WGS84 em graus decimais</div>

    O par lat/long é o padrão do sistema, derivado da UTM na importação quando o laudo não traz
    graus decimais — é o que permite pôr num mesmo mapa pontos de zonas UTM diferentes, como

  </div>

  <div class="diag" style="margin-bottom:18px;">
    <div class="diag-t">O código do ponto é a identidade dele</div>
    <div class="diag-d">A importação casa ponto por <span class="mono">código</span> e normaliza
    formas genéricas na entrada: <span class="mono">1º Ponto</span>,
    <span class="mono">Ponto 01</span>, <span class="mono">PONTO 01</span>,
    <span class="mono">01</span> e <span class="mono">P1</span> todos viram
    <span class="mono">P01</span>, e o texto original fica guardado.
    Códigos com prefixo próprio — <span class="mono">PM-01</span> de poço de monitoramento,
    <span class="mono">SS-03</span> de sondagem, <span class="mono">MTZ</span> de montante —
    são preservados como estão, porque ali o prefixo é informação.</div>
  </div>

  ${!lista.length ? `<div class="empty"><div class="ic">📍</div><p>Nenhum ponto cadastrado nesta matriz.</p></div>`
  : Object.entries(grupos).map(([empId, pts]) => `
      <div class="card" style="margin-bottom:18px;">
        <div class="card-pad" style="padding-bottom:0;"><div class="eyebrow">${esc(nomeEmp(empId))}</div></div>
        <div class="table-wrapper">
          <table>

            <tbody>
              ${pts.sort((a, b) => String(a.codigo).localeCompare(String(b.codigo))).map(p => `<tr>
                <td><strong>${esc(p.codigo)}</strong>${

                        if (o === 'derivada_da_utm') return '<br><span style="font-size:10px;color:var(--ink-faint);" title="Derivado da UTM declarada no laudo. Datum assumido WGS84.">derivada da UTM</span>';

window.editarPonto = function (id) {
  const p = state.pontos.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-backdrop" onclick="fecharModal(event)">
    <div class="modal" style="max-width:720px;" onclick="event.stopPropagation()">
      <div class="modal-head"><strong>Editar ponto ${esc(p.codigo)}</strong>
        <span style="font-weight:400;color:var(--ink-faint);font-size:12.5px;">${esc(rotuloMatriz(p.matriz, true))}</span></div>
      <div class="modal-body">
        <div class="fset">
          <div class="fset-t">Identificação</div>
          <div class="grid cols-3">
            <div class="field" style="margin-bottom:0;"><label class="field-label">Código</label>
              <input id="pe-cod" value="${esc(p.codigo)}"></div>
            <div class="field" style="margin-bottom:0;"><label class="field-label">Nome</label>
              <input id="pe-nome" value="${esc(p.nome || '')}"></div>
            <div class="field" style="margin-bottom:0;"><label class="field-label">Tipo</label>
              <select id="pe-tipo">${['interno', 'limite_propriedade', 'receptor', 'montante', 'jusante'].map(t =>
                `<option value="${t}" ${p.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          </div>
          <p class="hint">O código é a identidade do ponto: a importação casa por ele. Mudá-lo depois de
          importar campanhas parte a série histórica em duas.</p>
        </div>

        <div class="fset">
          <div class="fset-t">Coordenada declarada no laudo (UTM)</div>
          <div class="grid cols-3">
            <div class="field" style="margin-bottom:0;"><label class="field-label">Zona</label>
              <input id="pe-zona" value="${esc(p.utm_zona || '')}" placeholder="22K"></div>
            <div class="field" style="margin-bottom:0;"><label class="field-label">Este (E)</label>
              <input id="pe-e" type="number" step="1" value="${p.utm_e ?? ''}"></div>
            <div class="field" style="margin-bottom:0;"><label class="field-label">Norte (N)</label>
              <input id="pe-n" type="number" step="1" value="${p.utm_n ?? ''}"></div>
          </div>
          <button class="btn sm ghost" onclick="converterUtm()" style="margin-top:12px;">Converter para lat/long</button>
          <p class="hint">Esta é a coordenada que o laudo declarou — vale como rastreabilidade e não é
          sobrescrita quando você move o marcador no mapa.</p>
        </div>

        <div class="fset">
          <div class="fset-t">Posição — clique no mapa ou arraste o marcador</div>
          <div id="pe-mapa" class="mapbox" style="height:300px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;"></div>
          <div class="grid cols-2">
            <div class="field" style="margin-bottom:0;"><label class="field-label">Latitude</label>
              <input id="pe-lat" type="number" step="0.000001" value="${p.latitude ?? ''}"></div>
            <div class="field" style="margin-bottom:0;"><label class="field-label">Longitude</label>
              <input id="pe-lon" type="number" step="0.000001" value="${p.longitude ?? ''}"></div>
          </div>
          <button class="btn sm ghost" onclick="utmDoMapa()" style="margin-top:12px;">Recalcular UTM a partir daqui</button>
          <p class="hint" id="pe-msg">Os outros pontos do empreendimento aparecem em cinza para orientar
          o posicionamento.</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
        <button class="btn primary" onclick="salvarPonto('${esc(p.id)}')">Salvar</button>
      </div>
    </div>
  </div>`;

  // O mapa precisa existir no DOM antes de inicializar.
  const lat = p.latitude !== null ? Number(p.latitude) : null;
  const lon = p.longitude !== null ? Number(p.longitude) : null;
  const vizinhos = state.pontos.filter(x => x.id !== p.id && x.empreendimento_id === p.empreendimento_id
    && x.latitude !== null && x.longitude !== null);
  const centro = (lat !== null && lon !== null) ? [lat, lon]
    : (vizinhos.length ? [Number(vizinhos[0].latitude), Number(vizinhos[0].longitude)] : null);

  const m = criarMapa('pe-mapa', centro, centro ? 17 : 4);
  state.mapEdit = m;

  // Vizinhos em cinza, só para orientar quem está posicionando.
  vizinhos.forEach(x => L.circleMarker([Number(x.latitude), Number(x.longitude)],
    { radius: 6, color: '#fff', weight: 1.5, fillColor: '#888780', fillOpacity: 0.85 })
    .addTo(m).bindTooltip(x.codigo));

  let marca = null;
  function poe(la, lo) {
    if (marca) m.removeLayer(marca);
    marca = L.marker([la, lo], { draggable: true }).addTo(m);
    marca.on('dragend', () => {
      const c2 = marca.getLatLng();
      document.getElementById('pe-lat').value = c2.lat.toFixed(6);
      document.getElementById('pe-lon').value = c2.lng.toFixed(6);
      document.getElementById('pe-msg').textContent =
        'Posição ajustada no mapa. A UTM cadastrada continua a que o laudo declarou.';
    });
    document.getElementById('pe-lat').value = la.toFixed(6);
    document.getElementById('pe-lon').value = lo.toFixed(6);
  }
  if (lat !== null && lon !== null) poe(lat, lon);
  m.on('click', ev => {
    poe(ev.latlng.lat, ev.latlng.lng);
    document.getElementById('pe-msg').textContent =
      'Posição marcada no mapa. Confira contra o mapa de pontos do laudo antes de salvar.';
  });
  window._poeMarca = poe;
};

window.utmDoMapa = function () {
  const la = document.getElementById('pe-lat').value;
  const lo = document.getElementById('pe-lon').value;
  const r = latLonParaUtm(la, lo);
  const msg = document.getElementById('pe-msg');
  if (!r) { msg.textContent = 'Informe latitude e longitude primeiro.'; return; }
  document.getElementById('pe-zona').value = r.zona;
  document.getElementById('pe-e').value = r.e;
  document.getElementById('pe-n').value = r.n;
  msg.textContent = 'UTM recalculada do lat/long. Atenção: isto substitui a UTM que veio do laudo, '
    + 'que é dado de rastreabilidade. Use só quando a UTM original estava ausente ou errada.';
};

window.converterUtm = function () {
  const z = document.getElementById('pe-zona').value;
  const e = document.getElementById('pe-e').value;
  const n = document.getElementById('pe-n').value;
  const r = utmParaLatLon(z, e, n);
  const msg = document.getElementById('pe-msg');
  if (!r) { msg.textContent = 'Informe zona (ex.: 22K), E e N para converter.'; return; }
  document.getElementById('pe-lat').value = r.lat.toFixed(6);
  document.getElementById('pe-lon').value = r.lon.toFixed(6);
  if (window._poeMarca) window._poeMarca(r.lat, r.lon);
  if (state.mapEdit) state.mapEdit.setView([r.lat, r.lon], 17);
  msg.textContent = 'Convertido de UTM para WGS84. Confira contra o mapa do laudo antes de salvar.';
};

window.salvarPonto = async function (id) {
  const cod = document.getElementById('pe-cod').value.trim();
  if (!cod) return showToast('O código é obrigatório.');
  const p0 = state.pontos.find(x => x.id === id) || {};
  const det0 = Object.assign({}, p0.detalhes || {});
  det0.coord = Object.assign({}, det0.coord || {}, {
    origem: 'editada_manualmente',
    editada_em: new Date().toISOString(),
    editada_por: state.usuario || null
  });

  const patch = {
    codigo: cod,
    nome: document.getElementById('pe-nome').value.trim() || null,
    tipo: document.getElementById('pe-tipo').value,
    detalhes: det0,
    utm_zona: document.getElementById('pe-zona').value.trim() || null,
    utm_e: document.getElementById('pe-e').value === '' ? null : Number(document.getElementById('pe-e').value),
    utm_n: document.getElementById('pe-n').value === '' ? null : Number(document.getElementById('pe-n').value),
    latitude: document.getElementById('pe-lat').value === '' ? null : Number(document.getElementById('pe-lat').value),
    longitude: document.getElementById('pe-lon').value === '' ? null : Number(document.getElementById('pe-lon').value)
  };
  const { error } = await _supabase.from('mon_pontos').update(patch).eq('id', id);
  if (error) return showToast('Erro ao salvar: ' + error.message);
  fecharModal();
  showToast('Ponto atualizado.');
  await carregarTudo();
};

window.fecharModal = function (ev) {
  if (ev && ev.target !== ev.currentTarget) return;
  if (state.mapEdit) { state.mapEdit.remove(); state.mapEdit = null; }
  window._poeMarca = null;
  document.getElementById('modal-root').innerHTML = '';
};

/* ============================================================
   EDIÇÃO MANUAL DE RESULTADO
   ------------------------------------------------------------
   Erro de transcrição existe e precisa de caminho de correção. Mas resultado
   é dado medido: se o banco divergir do laudo sem rastro, a rastreabilidade
   morre e o relatório deixa de ser defensável numa auditoria. Por isso toda
   edição exige motivo, guarda o valor do laudo em valor_original e empilha o
   histórico em edicoes (append-only). Nada é sobrescrito em silêncio.
   ============================================================ */
const CAMPOS_EDITAVEIS = [
  'valor', 'unidade', 'qualificador', 'lq', 'ld', 'duracao_h',
  'inicio', 'fim', 'ponto_id', 'parametro_id', 'tipo_amostra',
  'status_dado', 'motivo_inconsistencia', 'metodo'
];

function badgeEditado(r) {
  if (!r.editado) return '';
  const div = r.valor_divergente_do_laudo;
  return `<span class="badge ${div ? 'pending' : 'na'}" style="margin-left:5px;"
    title="Editado manualmente${r.editado_por ? ' por ' + esc(r.editado_por) : ''}${r.editado_em ? ' em ' + fmtData(String(r.editado_em).slice(0,10)) : ''}${r.motivo_edicao ? '. Motivo: ' + esc(r.motivo_edicao) : ''}${div ? '. Valor difere do laudo (laudo: ' + num(r.valor_original,2) + ').' : ''}">editado${r.n_edicoes > 1 ? ' ×' + r.n_edicoes : ''}</span>`;
}

function dtLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

      <div class="modal-head"><strong>Editar resultado</strong>
        <span style="font-weight:400;color:var(--ink-faint);font-size:12.5px;">
          ${esc(pt ? pt.codigo : '?')} · ${esc(par ? par.sigla : '?')}</span>
      </div>
      <div class="modal-body">

window.salvarResultado = async function (id) {
  const r = state.resEdit;
  if (!r || r.id !== id) return showToast('Estado perdido. Reabra a edição.');

  const motivo = document.getElementById('re-motivo').value.trim();
  if (motivo.length < 15) return showToast('Descreva o motivo da edição (mínimo 15 caracteres).');

  const g = i => { const el = document.getElementById(i); return el ? el.value.trim() : ''; };
  const nOuNull = v => v === '' ? null : Number(v);
  const tsOuNull = v => v === '' ? null : new Date(v).toISOString();

  const novo = {
    valor: nOuNull(g('re-valor')),
    unidade: g('re-unidade') || r.unidade,
    qualificador: g('re-qual') || null,
    lq: nOuNull(g('re-lq')),
    ld: nOuNull(g('re-ld')),
    duracao_h: nOuNull(g('re-dur')),
    inicio: tsOuNull(g('re-inicio')),
    fim: tsOuNull(g('re-fim')),
    ponto_id: g('re-ponto') || r.ponto_id,
    parametro_id: g('re-param') || r.parametro_id,
    tipo_amostra: g('re-tipo') || r.tipo_amostra,
    status_dado: g('re-status') || r.status_dado,
    motivo_inconsistencia: g('re-motivoinc') || null,
    metodo: g('re-metodo') || null
  };

  if (!novo.unidade) return showToast('A unidade é obrigatória.');

  // Só registra o que efetivamente mudou.
  const antes = {}, depois = {};
  CAMPOS_EDITAVEIS.forEach(k => {
    const a = r[k] === undefined ? null : r[k];
    const b = novo[k];
    const igual = (a === null && b === null) || String(a) === String(b) ||
      (!isNaN(Number(a)) && !isNaN(Number(b)) && a !== null && b !== null && Number(a) === Number(b));
    if (!igual) { antes[k] = a; depois[k] = b; }
  });
  if (!Object.keys(depois).length) return showToast('Nada foi alterado.');

  const quem = state.usuario || 'usuário não identificado';
  const agora = new Date().toISOString();
  const hist = Array.isArray(r.edicoes) ? r.edicoes.slice() : [];
  hist.push({ em: agora, por: quem, motivo, antes, depois });

  const patch = Object.assign({}, novo, {
    editado_em: agora, editado_por: quem, motivo_edicao: motivo, edicoes: hist
  });
  // O valor do laudo é fotografado uma única vez, na primeira edição.
  if (r.valor_original === null || r.valor_original === undefined) {
    patch.valor_original = r.valor;
    patch.unidade_original = r.unidade;
  }

  const { error } = await _supabase.from('mon_resultados').update(patch).eq('id', id);
  if (error) return showToast('Erro ao salvar: ' + error.message);

  fecharModal();
  showToast(`Resultado editado. ${Object.keys(depois).length} campo(s) alterado(s).`);
  render();
};

window.reverterResultado = async function (id) {
  const r = state.resEdit;
  if (!r || r.valor_original === null) return;
  if (!confirm(`Reverter o valor para ${r.valor_original} ${r.unidade_original || ''}, como está no laudo?`)) return;
  const agora = new Date().toISOString();
  const quem = state.usuario || 'usuário não identificado';
  const hist = (Array.isArray(r.edicoes) ? r.edicoes.slice() : []);
  hist.push({ em: agora, por: quem, motivo: 'Revertido ao valor do laudo.',
    antes: { valor: r.valor, unidade: r.unidade },
    depois: { valor: r.valor_original, unidade: r.unidade_original } });
  const { error } = await _supabase.from('mon_resultados').update({
    valor: r.valor_original, unidade: r.unidade_original || r.unidade,
    editado_em: agora, editado_por: quem,
    motivo_edicao: 'Revertido ao valor do laudo.', edicoes: hist
  }).eq('id', id);
  if (error) return showToast('Erro ao reverter: ' + error.message);
  fecharModal();
  showToast('Valor revertido ao do laudo.');
  render();
};

  document.getElementById('modal-root').innerHTML = `

          <div class="diag-d">Ao registrar, você declara que comparou os ${linhas.length} valores desta norma
          com o texto oficial. A biblioteca é compartilhada por todos os clientes: um valor errado aqui
          contamina todas as avaliações, para trás e para frente no tempo.</div>
        </div>

        <div class="fset">
          <div class="fset-t">Fonte consultada</div>
          <div class="field"><label class="field-label">Tipo de fonte</label>
            <select id="cf-tipo">
              <option value="dou" ${atual.fonte_tipo === 'dou' ? 'selected' : ''}>Diário Oficial da União — fonte primária</option>
              <option value="orgao" ${atual.fonte_tipo === 'orgao' ? 'selected' : ''}>Publicação do órgão ambiental competente — fonte primária</option>
              <option value="reproducao" ${atual.fonte_tipo === 'reproducao' ? 'selected' : ''}>Reprodução em documento secundário — NÃO serve de base legal</option>
              <option value="nao_registrada" ${!atual.fonte_tipo || atual.fonte_tipo === 'nao_registrada' ? 'selected' : ''}>Origem não registrada</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;"><label class="field-label">Referência exata da fonte</label>
            <input id="cf-ref" value="${esc(atual.fonte_ref || '')}"
                   placeholder="Ex.: DOU de 21/11/2018, Seção 1, pág. 155">
            <p class="hint">Quanto mais específico, mais útil numa auditoria. Página, seção, ou URL da
            publicação oficial.</p>
          </div>
        </div>

        <div class="fset">
          <div class="fset-t">Quem conferiu</div>
          <div class="grid cols-2">
            <div class="field" style="margin-bottom:0;"><label class="field-label">Nome e registro profissional</label>
              <input id="cf-por" value="${esc(atual.conferido_por || state.usuario || '')}"
                     placeholder="Ex.: Maria Souza, CREA 12345/D-GO"></div>
            <div class="field" style="margin-bottom:0;"><label class="field-label">Data da conferência</label>
              <input id="cf-em" type="date" value="${esc(atual.conferido_em ? String(atual.conferido_em).slice(0,10) : new Date().toISOString().slice(0,10))}"></div>
          </div>
        </div>

        <div class="fset" id="cf-aviso-repro" style="display:none;border-color:var(--nc);">
          <div class="fset-t" style="color:var(--nc);">Fonte secundária não conferida</div>
          <p class="hint" style="color:var(--ink);">Reprodução e origem não registrada não sustentam base legal.
          Ao salvar com uma dessas opções, os ${linhas.length} padrões desta norma voltam para
          <strong>não conferido</strong> — os valores permanecem e continuam sendo usados na avaliação,
          mas a tela passa a exibir a ressalva.</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
        <button class="btn primary" onclick="salvarConferencia()">Salvar registro</button>
      </div>
    </div>
  </div>`;

  const sel = document.getElementById('cf-tipo');
  const mostra = () => {
    const sec = sel.value === 'reproducao' || sel.value === 'nao_registrada';
    document.getElementById('cf-aviso-repro').style.display = sec ? '' : 'none';
  };
  sel.onchange = mostra; mostra();
};

window.salvarConferencia = async function () {
  const norma = state.confNorma;
  const tipo = document.getElementById('cf-tipo').value;
  const ref = document.getElementById('cf-ref').value.trim();
  const por = document.getElementById('cf-por').value.trim();
  const em = document.getElementById('cf-em').value;
  const primaria = tipo === 'dou' || tipo === 'orgao';

  if (primaria) {
    if (ref.length < 8) return showToast('Descreva a referência da fonte (página, seção ou URL).');
    if (por.length < 4) return showToast('Informe quem conferiu, com registro profissional.');
    if (!em) return showToast('Informe a data da conferência.');
  }

  // conferido é consequência da procedência, não um campo independente.
  const patch = {
    fonte_tipo: tipo,
    fonte_ref: ref || null,
    conferido_por: primaria ? por : null,
    conferido_em: primaria ? em : null,
    conferido: primaria
  };

  const alvo = state.padroes.filter(x => (x.base_legal || '(sem base legal)') === norma).map(x => x.id);
  const { error } = await _supabase.from('mon_padroes_legais').update(patch).in('id', alvo);
  if (error) return showToast('Erro ao salvar: ' + error.message);

  fecharModal();
  showToast(primaria
    ? `${alvo.length} padrão(ões) marcados como conferidos.`
    : `${alvo.length} padrão(ões) voltaram para não conferido.`);
  await carregarTudo();
};

window.confirmarExclusao = async function (id) {
  if (document.getElementById('cd-confirma').value.trim().toUpperCase() !== 'EXCLUIR')
    return showToast('Digite EXCLUIR para confirmar.');
  for (const t of ['mon_resultados', 'mon_meteorologia']) {
    const { error } = await _supabase.from(t).delete().eq('campanha_id', id);
    if (error) return showToast(`Erro ao apagar ${t}: ` + error.message);
  }
  const { error } = await _supabase.from('mon_campanhas').delete().eq('id', id);
  if (error) return showToast('Erro ao apagar campanha: ' + error.message);
  fecharModal();
  showToast('Campanha excluída.');
  state.detalhe = null;
  setView('campanhas');
  await carregarTudo();
};

async function bindPontos() {
  const { data } = await _supabase.from('mon_resultados').select('ponto_id,campanha_id');
  if (!data) return;
  const m = {};
  data.forEach(r => { (m[r.ponto_id] = m[r.ponto_id] || new Set()).add(r.campanha_id); });
  state.contagemPonto = {};
  Object.entries(m).forEach(([k, v]) => { state.contagemPonto[k] = v.size + (v.size === 1 ? ' campanha' : ' campanhas'); });
  const el = document.getElementById('content');
  if (el && state.view === 'pontos') el.innerHTML = viewPontos();
}

function viewBiblioteca() {
  const porParam = {};
  state.padroes.forEach(p => { (porParam[p.parametro_id] = porParam[p.parametro_id] || []).push(p); });
  const pendentes = state.padroes.filter(p => !p.conferido).length;

  return `
  <div class="view-head">
    <div>
      <div class="eyebrow">Biblioteca da MapaBase</div>
      <h1 class="view-title">Padrões legais</h1>
      <p class="view-sub">Curada por vocês, compartilhada por todos os clientes. É o que permite avaliar laudo antigo pelo padrão da época.</p>
    </div>
  </div>

  ${pendentes ? `<div class="diag aviso" style="margin-bottom:20px;">
    <div class="diag-t">${pendentes} de ${state.padroes.length} padrões sem conferência em fonte primária</div>
    <div class="diag-d">Use <em>Registrar conferência</em> na norma correspondente.
    <a href="#biblio-ajuda" style="color:var(--accent);">Por que isso importa</a></div>
  </div>` : ''}

  <div class="card card-pad" style="margin-bottom:22px;">
    <div class="eyebrow" style="margin-bottom:10px;">Normas na biblioteca</div>
    <p style="font-size:12px;color:var(--ink-faint);margin:0 0 12px;">
      A conferência é por norma, não linha por linha: você abre o Diário Oficial uma vez e valida o anexo
      inteiro. O registro fica em cada padrão daquela norma.
    </p>
    <div class="table-wrapper"><table>
      <thead><tr><th>Norma</th><th>Padrões</th><th>Avaliáveis</th><th>Procedência</th><th>Conferido por</th><th></th></tr></thead>
      <tbody>
      ${Object.entries(state.padroes.reduce((a, x) => {
          const k = x.base_legal || '(sem base legal)';
          a[k] = a[k] || { n: 0, av: 0, conf: 0, fontes: new Set(), por: new Set(), em: new Set() };
          a[k].n++; if (x.avaliavel) a[k].av++; if (x.conferido) a[k].conf++;
          a[k].fontes.add(x.fonte_tipo || 'nao_registrada');
          if (x.conferido_por) a[k].por.add(x.conferido_por);
          if (x.conferido_em) a[k].em.add(String(x.conferido_em).slice(0, 10));
          return a;
        }, {})).sort().map(([norma, g]) => {
          const rot = { dou: 'DOU', orgao: 'Órgão', reproducao: 'Reprodução', nao_registrada: 'Não registrada' };
          const primaria = [...g.fontes].every(f => f === 'dou' || f === 'orgao');
          const ok = g.conf === g.n && primaria;
          return `<tr>
            <td><strong>${esc(norma)}</strong></td>
            <td class="mono">${g.n}</td>
            <td class="mono">${g.av}</td>
            <td>${[...g.fontes].map(f => ok
                ? `<span class="badge conforme">${rot[f]}</span>`
                : `<span class="badge ${g.conf ? 'nc' : 'pending'}">${rot[f]}</span>`).join(' ')}
              ${g.conf && g.conf < g.n ? `<br><span style="font-size:10.5px;color:var(--ink-faint);">${g.conf} de ${g.n} conferidos</span>` : ''}</td>
            <td style="font-size:11.5px;">${g.por.size ? esc([...g.por].join(', ')) : '—'}
              ${g.em.size ? `<br><span style="color:var(--ink-faint);">${[...g.em].sort().map(fmtData).join(', ')}</span>` : ''}</td>
            <td style="white-space:nowrap;">
              <button class="btn sm ${ok ? 'ghost' : 'primary'}" onclick="registrarConferencia('${esc(norma)}')">
                ${ok ? 'Revisar registro' : 'Registrar conferência'}</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>

  ${[...new Set(state.parametros.filter(p => porParam[p.id]).map(p => p.matriz))].sort()
      .filter(mz => !state.matriz || mz === state.matriz).map(mz => `
    <h2 style="font-size:15px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:8px;">
      ${badgeMatriz(mz)} <span style="color:var(--ink-soft);font-weight:500;">${esc(rotuloMatriz(mz, true))}</span>
      <span style="font-size:12px;color:var(--ink-faint);font-weight:400;">${MATRIZES[mz] ? '· ' + esc(MATRIZES[mz].norma) : ''}</span>
    </h2>
    ${state.parametros.filter(p => porParam[p.id] && p.matriz === mz).map(par => `
    <div class="card" style="margin-bottom:18px;">
      <div class="card-pad" style="padding-bottom:0;">
        <div class="eyebrow">${esc(par.sigla)} — ${esc(par.nome)} · ${esc(par.unidade)}</div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr>
            <th title="No ar é a etapa da norma (PI-1 a PI-4, PF). Em água superficial seria a classe do corpo hídrico; no solo, o cenário de uso; no ruído, o zoneamento.">Contexto</th>
            <th title="Janela de tempo a que o limite se refere. Um resultado de 24 h só pode ser comparado a um limite de 24 h.">Período</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th title="Intervalo de datas em que este padrão vale. É o que permite avaliar laudo de 2021 pela norma de 2021.">Vigência</th>
            <th title="Este padrão entra no cálculo de conformidade? Fica em Não quando a etapa nunca foi ativada pela norma, ou quando o período é anual e quatro dias de coleta por ano não produzem média anual.">Avaliável</th>
          </tr></thead>
          <tbody>
            ${porParam[par.id].slice().sort((a, b) => {
                  // Etapa na ordem cronologica da norma, nao alfabetica: PF vinha
                  // antes de PI-1 e a escada aparecia fora de sequencia.
                  const ord = c => ({ 'PI-1': 1, 'PI-2': 2, 'PI-3': 3, 'PI-4': 4, 'PF': 5 })[c] ?? 9;
                  const per = x => ({ '1h': 1, '8h': 2, '24h': 3, 'anual': 4 })[x.periodo_referencia] ?? 9;
                  return per(a) - per(b)
                      || ord(a.contexto) - ord(b.contexto)
                      || String(a.vigencia_inicio || '9999').localeCompare(String(b.vigencia_inicio || '9999'));
                }).map(p => `
              <tr>
                <td><strong>${esc(p.contexto)}</strong><br><span style="font-size:11px;color:var(--ink-faint);">${esc(p.base_legal)}</span></td>
                <td class="mono">${esc(p.periodo_referencia)}</td>
                <td class="mono">${esc(p.tipo_limite)}</td>
                <td class="mono"><strong>${p.valor === null ? '—' : num(p.valor, 2)}</strong></td>
                <td class="mono" style="font-size:11.5px;">${p.vigencia_inicio
                    ? fmtData(p.vigencia_inicio) + (p.vigencia_fim ? ' a ' + fmtData(p.vigencia_fim) : ' em diante')
                    : '<span style="font-family:var(--font-sans);color:var(--ink-faint);" title="A norma prevê esta etapa, mas ela nunca entrou em vigor. Fica registrada para o caso de ser ativada.">etapa não ativada</span>'}</td>
                <td>${p.avaliavel ? '<span class="badge conforme">Sim</span>' : `<span class="badge na" title="${esc(p.observacao || '')}">Não</span>`}</td>

              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`).join('')}`).join('')}

  <div id="biblio-ajuda" style="margin-top:26px;">${caixaProcedencia(state.padroes)}</div>

  <p style="font-size:12px;color:var(--ink-faint);">
    Para acrescentar solo (CONAMA 420), água subterrânea (396), superficial (357), efluente (430),
    ruído ou sismografia, me mande os parâmetros da matriz. A estrutura já aceita: o contexto guarda
    cenário de uso, classe do corpo hídrico ou zoneamento, e o tipo de limite distingue VRQ, VP, VI e VMP.
  </p>`;
}

/* ============================================================
   ROTEADOR
   ============================================================ */
const VIEWS = {
  painel:     { label: 'Painel geral',   html: viewPainel,     bind: bindPainel },
  campanhas:  { label: 'Campanhas',      html: viewCampanhas,  bind: bindCampanhas },
  importar:   { label: 'Importar',       html: viewImportar,   bind: bindImportar },
  serie:      { label: 'Série histórica',html: viewSerie,      bind: bindSerie },
  mapa:       { label: 'Mapa',            html: viewMapa,       bind: bindMapa },
  pontos:     { label: 'Pontos',         html: viewPontos,     bind: bindPontos },
  biblioteca: { label: 'Padrões legais', html: viewBiblioteca, bind: null },
  detalhe:    { label: null,             html: viewDetalhe,    bind: bindDetalhe }
};

function setView(v) {
  if (state.map) { state.map.remove(); state.map = null; }
  if (state.mapEdit) { state.mapEdit.remove(); state.mapEdit = null; }
  state.view = v;
  document.getElementById('modal-root').innerHTML = '';
  render();
  window.scrollTo(0, 0);
}
window.setView = setView;

function render() {
  if (!state.ready) return;

  const ic = {
    painel:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>',
    campanhas:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 3v3M16 3v3M4 10h16"/></svg>',
    importar:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>',
    serie:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>',
    mapa:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>',
    pontos:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    biblioteca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4Z"/><path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6Z"/></svg>'
  };

  // Sete itens numa lista plana misturavam naturezas diferentes: análise,
  // registro, entrada de dado e curadoria da biblioteca. Agrupar deixa claro
  // que "Padrões legais" é curadoria, não configuração.
  const NAV_GRUPOS = [
    { titulo: 'Análise',             abas: ['painel', 'serie', 'mapa'] },
    { titulo: 'Registros',           abas: ['campanhas', 'pontos'] },
    { titulo: 'Entrada e curadoria', abas: ['importar', 'biblioteca'] }
  ];
  const btn = k => VIEWS[k] && VIEWS[k].label
    ? `<button class="navbtn ${state.view === k ? 'active' : ''}" onclick="setView('${k}')">
         <span class="ic">${ic[k] || ''}</span> ${VIEWS[k].label}</button>`
    : '';
  document.getElementById('mainnav').innerHTML = NAV_GRUPOS
    .map(g => `<div class="nav-grupo">${esc(g.titulo)}</div>${g.abas.map(btn).join('')}`).join('');

  const mats = matrizesExistentes();
  if (state.matriz === null) state.matriz = mats.length === 1 ? mats[0] : '';
  const sel = document.getElementById('sel-matriz');
  sel.innerHTML = `${mats.length > 1 ? `<option value="" ${state.matriz === '' ? 'selected' : ''}>Todos os monitoramentos</option>` : ''}
    ${mats.map(m => `<option value="${esc(m)}" ${state.matriz === m ? 'selected' : ''}>${esc(rotuloMatriz(m, true))}</option>`).join('')}
    ${Object.keys(MATRIZES).filter(m => !mats.includes(m)).map(m => `<option value="${esc(m)}" disabled>${esc(rotuloMatriz(m, true))} — sem dados</option>`).join('')}`;
  sel.onchange = () => {
    state.matriz = sel.value;
    ['painel', 'serie', 'mapa'].forEach(k => { state[k].emps = []; state[k].camps = []; state[k].pontos = []; state[k].params = []; });
    state.detalhe = null;
    if (state.view === 'detalhe') state.view = 'campanhas';
    render();
  };
  const pts = state.pontos.filter(p => !state.matriz || p.matriz === state.matriz);
  const empsCtx = new Set(pts.map(p => p.empreendimento_id));
  const nCamp = state.campanhas.filter(c => empsCtx.has(c.empreendimento_id)).length;
  const plural = (n, s1, s2) => `${n} ${n === 1 ? s1 : s2}`;
  document.getElementById('mtz-sub').innerHTML = state.matriz
    ? `${plural(pts.length, 'ponto', 'pontos')} · ${plural(nCamp, 'campanha', 'campanhas')}
       <div class="mtz-norma">${esc(MATRIZES[state.matriz] ? MATRIZES[state.matriz].norma : '')}</div>`
    : `${plural(mats.length, 'tipo', 'tipos')} · ${plural(pts.length, 'ponto', 'pontos')}
       <div class="mtz-norma">Todos os monitoramentos</div>`;

  document.getElementById('status-sync').textContent = navigator.onLine ? '🟢 Online' : '🔴 Sem conexão';

  const v = VIEWS[state.view] || VIEWS.campanhas;
  document.getElementById('content').innerHTML = v.html();
  if (v.bind) v.bind();
}

/* ============================================================
   AUTENTICAÇÃO (sessão compartilhada com o app de campo)
   ============================================================ */
async function checkAuth() {
  const tela = document.getElementById('login-screen');

  if (!_supabase) {
    alert('Supabase não configurado nesta página.');
    return;
  }
  if (!navigator.onLine) {
    tela.querySelector('.login-box').innerHTML =
      '<p style="font-size:14px;color:var(--ink-soft);">Monitoramentos precisa de internet. Reconecte e recarregue a página.</p>';
    return;
  }

  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    state.usuario = (session.user && session.user.email) || null;
    tela.style.display = 'none';
    carregarTudo();
    return;
  }

  document.getElementById('btn-entrar').onclick = async () => {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-pass').value;
    const { error } = await _supabase.auth.signInWithPassword({ email, password: pass });
    if (error) return alert('Falha no login. Verifique as credenciais.');
    state.usuario = email;
    tela.style.display = 'none';
    carregarTudo();
  };
  document.getElementById('login-pass').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('btn-entrar').click();
  });
}

document.getElementById('btn-logout').onclick = async () => {
  if (_supabase) { await _supabase.auth.signOut(); window.location.href = './index.html'; }
};

// Fecha qualquer dropdown aberto ao clicar fora dele.
document.addEventListener('click', ev => {
  document.querySelectorAll('details.multi-select-details[open]').forEach(d => {
    if (!d.contains(ev.target)) d.open = false;
  });
});

window.addEventListener('online',  () => render());
window.addEventListener('offline', () => render());

checkAuth();
</script>
